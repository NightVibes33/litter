  LiveProcess:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    entitlements:
      path: ../../ThirdParty/EmexDE/Source/LiveProcess/LiveProcess.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sigkitten.litter.39A8Q3T3TR.liveprocess
        PRODUCT_NAME: LiveProcess
        INFOPLIST_FILE: ../../ThirdParty/EmexDE/Source/LiveProcess/Info.plist
        INFOPLIST_KEY_CFBundleIdentifier: "$(PRODUCT_BUNDLE_IDENTIFIER)"
        INFOPLIST_KEY_CFBundleExecutable: "$(EXECUTABLE_NAME)"
        INFOPLIST_KEY_CFBundleDisplayName: LiveProcess
        INFOPLIST_KEY_CFBundleName: LiveProcess
        INFOPLIST_KEY_CFBundlePackageType: XPC!
        INFOPLIST_KEY_CFBundleShortVersionString: "$(MARKETING_VERSION)"
        INFOPLIST_KEY_CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        APPLICATION_EXTENSION_API_ONLY: "YES"
        DEAD_CODE_STRIPPING: "NO"
        CLANG_ENABLE_MODULES: "YES"
        CLANG_CXX_LANGUAGE_STANDARD: "gnu++20"
        OTHER_CFLAGS: "$(inherited) -DCLIENT_ENV"
        OTHER_LDFLAGS: "$(inherited) -Wl,-U,_OBJC_CLASS_$_FBSSceneParameters -Wl,-U,_OBJC_CLASS_$_LSApplicationWorkspace -lc++ -lz -larchive -framework OpenSSL"
        HEADER_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../../ThirdParty/EmexDE/Source/Nyxian $(SRCROOT)/../../ThirdParty/EmexDE/Source/Nyxian/LindChain $(SRCROOT)/../../ThirdParty/EmexDE/Source/LiveProcess $(SRCROOT)/../../ThirdParty/EmexDE/Source/LiveProcess/LindChain $(BUILT_PRODUCTS_DIR)/CoreCompiler.framework/Headers $(BUILT_PRODUCTS_DIR)/MobileDevelopmentKit.framework/Headers"
