      - sdk: libz.tbd
      - package: EmexDERunestone
        product: Runestone
      - package: EmexDESwiftTerm
        product: SwiftTerm
      - package: EmexDETreeSitterObjc
        product: TreeSitterObjc
      - package: EmexDETreeSitterC
