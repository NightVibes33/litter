        embed: true
    postBuildScripts:
      - name: Embed Bundled iSH Filesystem
        basedOnDependencyAnalysis: false
        script: |
          set -eu
          if [ "${PLATFORM_NAME:-}" != "iphoneos" ]; then
            exit 0
          fi
          RESOURCES_DIR="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
          SRC_ROOTFS="$SRCROOT/Resources/fs.tar.gz"
          SRC_VERSION="$SRCROOT/Resources/fs.version"
          if [ ! -s "$SRC_ROOTFS" ]; then
            echo "error: missing bundled iSH filesystem at $SRC_ROOTFS" >&2
            exit 1
          fi
          mkdir -p "$RESOURCES_DIR"
          /usr/bin/ditto "$SRC_ROOTFS" "$RESOURCES_DIR/fs.tar.gz"
          if [ -s "$SRC_VERSION" ]; then
            /usr/bin/ditto "$SRC_VERSION" "$RESOURCES_DIR/fs.version"
          else
            printf '%s\n' unknown > "$RESOURCES_DIR/fs.version"
          fi
          if [ ! -s "$RESOURCES_DIR/fs.tar.gz" ]; then
            echo "error: bundled iSH filesystem copy failed" >&2
            exit 1
          fi
          echo "Embedded bundled iSH filesystem archive"
      - name: Sign Alpine FS Native Modules
        basedOnDependencyAnalysis: false
        script: |
          set -eu
          if [ "${PLATFORM_NAME:-}" != "iphoneos" ]; then
            exit 0
          fi
          if [ "${CODE_SIGNING_ALLOWED:-NO}" != "YES" ] || [ -z "${EXPANDED_CODE_SIGN_IDENTITY:-}" ]; then
            echo "Skipping Alpine fs module signing because code signing is disabled"
            exit 0
          fi
          FS_ROOT="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/fs"
          if [ ! -d "$FS_ROOT" ]; then
            exit 0
          fi
          find "$FS_ROOT" -type f \( -name '*.so' -o -name '*.dylib' \) -print | while IFS= read -r item; do
            if /usr/bin/file "$item" 2>/dev/null | /usr/bin/grep -q 'Mach-O'; then
              /usr/bin/codesign --force --sign "$EXPANDED_CODE_SIGN_IDENTITY" --timestamp=none "$item"
              echo "Signed Alpine fs native module: $item"
            else
              /bin/mv "$item" "$item.litter-elf"
              echo "Hid Alpine fs non-Mach-O module from Apple code signing scan: $item"
            fi
          done
    settings:
      base:
        PRODUCT_NAME: "Alley Cãt"
        PRODUCT_BUNDLE_IDENTIFIER: com.sigkitten.litter.39A8Q3T3TR
        INFOPLIST_FILE: Sources/Litter/Info.plist
