      configs:
        Debug:
          CODE_SIGN_STYLE: "$(LIVEPROCESS_CODE_SIGN_STYLE)"
          LIVEPROCESS_CODE_SIGN_STYLE: Automatic
          PROVISIONING_PROFILE_SPECIFIER: "$(LIVEPROCESS_PROVISIONING_PROFILE_SPECIFIER)"
          LIVEPROCESS_PROVISIONING_PROFILE_SPECIFIER: ""
        Release:
          CODE_SIGN_STYLE: "$(LIVEPROCESS_CODE_SIGN_STYLE)"
          LIVEPROCESS_CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "$(LIVEPROCESS_CODE_SIGN_IDENTITY)"
          LIVEPROCESS_CODE_SIGN_IDENTITY: ""
          PROVISIONING_PROFILE_SPECIFIER: "$(LIVEPROCESS_PROVISIONING_PROFILE_SPECIFIER)"
          LIVEPROCESS_PROVISIONING_PROFILE_SPECIFIER: ""
    sources:
      - path: ../../ThirdParty/EmexDE/Source/LiveProcess/main.m
        headerVisibility: project
      - path: ../../ThirdParty/EmexDE/Source/LiveProcess/ResecureDecoder.m
        headerVisibility: project
      - path: ../../ThirdParty/EmexDE/Source/LiveProcess/LindChain/ServiceKit/Service.m
        headerVisibility: project
      - path: ../../ThirdParty/EmexDE/Source/LiveProcess/LindChain/Services/applicationmgmtd/LDEApplicationObject.m
        headerVisibility: project
      - path: ../../ThirdParty/EmexDE/Source/LiveProcess/LindChain/Services/applicationmgmtd/LDEApplicationWorkspaceInternal.m
        headerVisibility: project
      - path: ../../ThirdParty/EmexDE/Source/LiveProcess/LindChain/Services/containerd/PEContainerService.m
        headerVisibility: project
      - path: ../../ThirdParty/EmexDE/Source/Nyxian/LindChain/Debugger/Utils.c
        headerVisibility: project
      - path: ../../ThirdParty/EmexDE/Source/Nyxian/LindChain/litehook/litehook.c
        headerVisibility: project
