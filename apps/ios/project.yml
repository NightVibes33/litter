  LitterWatch:
    build:
      targets:
        LitterWatch: all
        LitterWatchComplications: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
    management:
      isShown: true
      orderHint: 2
  Litter:
    build:
      targets:
        Litter: all
    run:
      config: Debug
      customLLDBInit: $(SRCROOT)/.lldbinit
    test:
      config: Debug
      targets:
        - LitterTests
        - LitterUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
    management:
      isShown: true
      orderHint: 1
  LitterMac:
    build:
      targets:
        LitterMac: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    # Default archive uses Release (sandboxed) for the App Store lane.
    # The direct-distribution script overrides via `-configuration DeveloperID`.
    archive:
      config: Release
    management:
      isShown: true
      orderHint: 3
