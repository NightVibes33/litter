        headerVisibility: public
        excludes:
          - CCBaseSwift.swift
          - CoreCompiler.docc/**
          - CoreCompilerSupportLibs/**
    dependencies:
      - framework: ../../ThirdParty/EmexDE/Source/CoreCompiler/CoreCompilerSupportLibs/LLVM.xcframework
      - framework: ../../ThirdParty/EmexDE/Source/CoreCompiler/CoreCompilerSupportLibs/lib_CompilerSwiftBasicFormat.dylib
      - framework: ../../ThirdParty/EmexDE/Source/CoreCompiler/CoreCompilerSupportLibs/lib_CompilerSwiftCompilerPluginMessageHandling.dylib
      - framework: ../../ThirdParty/EmexDE/Source/CoreCompiler/CoreCompilerSupportLibs/lib_CompilerSwiftDiagnostics.dylib
      - framework: ../../ThirdParty/EmexDE/Source/CoreCompiler/CoreCompilerSupportLibs/lib_CompilerSwiftIDEUtils.dylib
      - framework: ../../ThirdParty/EmexDE/Source/CoreCompiler/CoreCompilerSupportLibs/lib_CompilerSwiftIfConfig.dylib
      - framework: ../../ThirdParty/EmexDE/Source/CoreCompiler/CoreCompilerSupportLibs/lib_CompilerSwiftLexicalLookup.dylib
      - framework: ../../ThirdParty/EmexDE/Source/CoreCompiler/CoreCompilerSupportLibs/lib_CompilerSwiftOperators.dylib
      - framework: ../../ThirdParty/EmexDE/Source/CoreCompiler/CoreCompilerSupportLibs/lib_CompilerSwiftParser.dylib
      - framework: ../../ThirdParty/EmexDE/Source/CoreCompiler/CoreCompilerSupportLibs/lib_CompilerSwiftParserDiagnostics.dylib
      - framework: ../../ThirdParty/EmexDE/Source/CoreCompiler/CoreCompilerSupportLibs/lib_CompilerSwiftSyntax.dylib
      - framework: ../../ThirdParty/EmexDE/Source/CoreCompiler/CoreCompilerSupportLibs/lib_CompilerSwiftSyntaxBuilder.dylib
      - framework: ../../ThirdParty/EmexDE/Source/CoreCompiler/CoreCompilerSupportLibs/lib_CompilerSwiftSyntaxMacroExpansion.dylib
      - framework: ../../ThirdParty/EmexDE/Source/CoreCompiler/CoreCompilerSupportLibs/lib_CompilerSwiftSyntaxMacros.dylib

  MobileDevelopmentKit:
    type: framework
    platform: iOS
    deploymentTarget: "18.0"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sigkitten.litter.emexde.MobileDevelopmentKit
        PRODUCT_MODULE_NAME: MobileDevelopmentKit
        GENERATE_INFOPLIST_FILE: "YES"
        DEFINES_MODULE: "YES"
        CLANG_ENABLE_MODULES: "YES"
        CLANG_CXX_LANGUAGE_STANDARD: "gnu++20"
        SWIFT_VERSION: "6.0"
        APPLICATION_EXTENSION_API_ONLY: "YES"
        HEADER_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../../ThirdParty/EmexDE/Source/MobileDevelopmentKit $(SRCROOT)/../../ThirdParty/EmexDE/Source/MobileDevelopmentKit/PhaseEngine $(SRCROOT)/../../ThirdParty/EmexDE/Source/MobileDevelopmentKit/Support $(SRCROOT)/../../ThirdParty/EmexDE/Source/MobileDevelopmentKit/Tools $(SRCROOT)/../../ThirdParty/EmexDE/Source/MobileDevelopmentKit/Tools/Compiler $(SRCROOT)/../../ThirdParty/EmexDE/Source/MobileDevelopmentKit/Tools/Linker $(BUILT_PRODUCTS_DIR)/CoreCompiler.framework/Headers"
    sources:
      - path: ../../ThirdParty/EmexDE/Source/MobileDevelopmentKit
        headerVisibility: public
        excludes:
          - MobileDevelopmentKit.docc/**
    dependencies:
