[package]
name = "security-compat-tests"
version = "0.1.0"
edition = "2021"
publish = false

[dev-dependencies]
ansi_term = { path = "../vendor/security-compat/ansi_term" }
json = { path = "../vendor/security-compat/json" }
fxhash = { path = "../vendor/security-compat/fxhash" }
paste = { path = "../vendor/security-compat/paste" }
atomic-polyfill = { path = "../vendor/security-compat/atomic-polyfill" }

ssh-key = { version = "0.7.0-rc.11", features = ["rsa", "std"] }
signature = "3"
russh = { workspace = true }

base64 = "0.22"
basic-toml = { path = "../vendor/security-compat/basic-toml" }
serde_yaml = { path = "../vendor/security-compat/serde_yaml" }
serde = { version = "1", features = ["derive"] }
zip = { version = "9.1.1", default-features = false, features = ["deflate"] }
tempfile = "3"

openssl = { version = "0.10.80", features = ["vendored"] }
