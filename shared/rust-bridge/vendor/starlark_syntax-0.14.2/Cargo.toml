[package]
authors = [
    "Damien Martin-Guillerez <dmarting@google.com>",
    "Facebook",
]
categories = ["parser-implementations", "development-tools"]
description = "Starlark language AST"
documentation = "https://docs.rs/starlark"
edition = "2024"
keywords = ["starlark", "skylark", "bazel", "language", "interpreter"]
license = "Apache-2.0"
name = "starlark_syntax"
repository = "https://github.com/facebook/starlark-rust"
version = "0.14.2"

[dependencies]
annotate-snippets = { version = "0.9.0", features = [] }
anyhow = "1.0.102"
derive_more = { version = "1.0.0", features = ["full"] }
logos = "0.15"
lsp-types = "0.97.0"
memchr = "2.8.0"
num-bigint = { version = "0.4.6", features = ["serde"] }
num-traits = "0.2"
once_cell = "1.21.4"
thiserror = "2.0.18"

allocative = { version = "0.3.6", git = "https://github.com/facebook/starlark-rust", rev = "3bed1c40f93da22b8e251dd520dfb8d35bfe1fb7" }
dupe = { version = "0.9.1", git = "https://github.com/facebook/starlark-rust", rev = "3bed1c40f93da22b8e251dd520dfb8d35bfe1fb7" }
pagable = { version = "0.4.1", git = "https://github.com/facebook/starlark-rust", rev = "3bed1c40f93da22b8e251dd520dfb8d35bfe1fb7" }
starlark_map = { version = "0.14.2", git = "https://github.com/facebook/starlark-rust", rev = "3bed1c40f93da22b8e251dd520dfb8d35bfe1fb7" }

[dev-dependencies]
serde_json = "1.0"
