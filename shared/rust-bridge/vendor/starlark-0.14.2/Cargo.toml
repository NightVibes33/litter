[package]
authors = [
    "Damien Martin-Guillerez <dmarting@google.com>",
    "Stepan Koltsov <stepan.koltsov@gmail.com>",
    "Facebook",
]
build = "build.rs"
categories = ["parser-implementations", "development-tools"]
description = "An implementation of the Starlark language in Rust."
documentation = "https://docs.rs/starlark"
edition = "2024"
keywords = ["starlark", "skylark", "bazel", "language", "interpreter"]
license = "Apache-2.0"
name = "starlark"
repository = "https://github.com/facebook/starlark-rust"
version = "0.14.2"

[features]
default = []
pagable = []

[dependencies]
anyhow = "1.0.65"
blake3 = { version = "1.8", features = ["default", "rayon", "std", "traits-preview"] }
bumpalo = "3.8"
dashmap = "6.1.0"
debugserver-types = "0.5.0"
derive_more = { version = "1.0.0", features = ["full"] }
display_container = { version = "0.9.0", git = "https://github.com/facebook/starlark-rust", rev = "3bed1c40f93da22b8e251dd520dfb8d35bfe1fb7" }
dupe = { version = "0.9.1", git = "https://github.com/facebook/starlark-rust", rev = "3bed1c40f93da22b8e251dd520dfb8d35bfe1fb7" }
either = "1.8"
erased-serde = "0.3.12"
hashbrown = { version = "0.16.1" }
indexmap = "2.2"
inventory = "0.3.8"
itertools = "0.14.0"
maplit = "1.0.2"
num-bigint = { version = "0.4.6", features = ["serde"] }
num-traits = "0.2"
once_cell = "1.21.4"
paste = "1.0"
ref-cast = "1.0.18"
regex = "1.5.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["arbitrary_precision"] }
starlark_derive = { version = "=0.14.2", git = "https://github.com/facebook/starlark-rust", rev = "3bed1c40f93da22b8e251dd520dfb8d35bfe1fb7" }
starlark_map = { version = "0.14.2", git = "https://github.com/facebook/starlark-rust", rev = "3bed1c40f93da22b8e251dd520dfb8d35bfe1fb7", features = ["pagable_dep"] }
starlark_syntax = { version = "0.14.2", path = "../starlark_syntax-0.14.2" }
static_assertions = "1.1.0"
strong_hash = { version = "0.1.0", git = "https://github.com/facebook/starlark-rust", rev = "3bed1c40f93da22b8e251dd520dfb8d35bfe1fb7" }
strsim = "0.11.1"
textwrap = "0.11"
thiserror = "2.0.18"

allocative = { version = "0.3.6", git = "https://github.com/facebook/starlark-rust", rev = "3bed1c40f93da22b8e251dd520dfb8d35bfe1fb7", features = ["bumpalo", "dashmap", "num-bigint"] }
cmp_any = { version = "0.8.1", git = "https://github.com/facebook/starlark-rust", rev = "3bed1c40f93da22b8e251dd520dfb8d35bfe1fb7" }
pagable = { version = "0.4.1", git = "https://github.com/facebook/starlark-rust", rev = "3bed1c40f93da22b8e251dd520dfb8d35bfe1fb7" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rustyline = "14.0"

[dev-dependencies]
rand = "0.10"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(rust_nightly)", "cfg(starlark_require_heap_names)", "cfg(feature, values(\"pagable\", \"pagable_dep\"))"] }

[patch.crates-io]
paste = { path = "../security-compat/paste" }
json = { path = "../security-compat/json" }
ansi_term = { path = "../security-compat/ansi_term" }
fxhash = { path = "../security-compat/fxhash" }
atomic-polyfill = { path = "../security-compat/atomic-polyfill" }
