[package]
name = "rust_bridge"
version = "1.0.0"
edition = "2021"

[dependencies]
# <--- bridge.rs -->
# Service wrappers: Device, Lockdown, AFC, InstProxy, Misagent, Mounter, Heartbeat, DebugServer
rusty_libimobiledevice = { git = "https://github.com/SideStore/rusty_libimobiledevice", features = [
  "dynamic",
], default-features = false }
# Plist parsing: instproxy lookup, misagent copy, heartbeat, mounter lookup
plist_plus = { version = "0.2", features = ["dynamic"] }
# JSON serialization: debugserver_set_argv, afc_get_file_info, afc_read_directory
serde_json = "1"

# <--- post17.rs -->
# iOS 17+ async operations: CoreDeviceProxy, XPCDevice, DVT, DebugProxy, ImageMounter
idevice = { path = "../../../../vendor/idevice-0.1.56", features = ["afc", "core_device_proxy", "debug_proxy", "dvt", "heartbeat", "installation_proxy", "misagent", "mobile_image_mounter", "remote_pairing", "rsd", "tcp", "tss", "tunnel_tcp_stack", "usbmuxd", "xpc"] }
plist = "1.7.1"
# Async runtime: block_on for iOS 17+ JIT and DDI mount
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net"] }
# Lazy static RUNTIME
once_cell = "1"
# Logging
log = "0.4"

[lib]
crate-type = ["staticlib"]
name = "rust_bridge"

[patch.crates-io]
paste = { path = "../../../../../../shared/rust-bridge/vendor/security-compat/paste" }
json = { path = "../../../../../../shared/rust-bridge/vendor/security-compat/json" }
ansi_term = { path = "../../../../../../shared/rust-bridge/vendor/security-compat/ansi_term" }
fxhash = { path = "../../../../../../shared/rust-bridge/vendor/security-compat/fxhash" }
atomic-polyfill = { path = "../../../../../../shared/rust-bridge/vendor/security-compat/atomic-polyfill" }

atty = { path = "../../../../vendor/atty-compat" }
