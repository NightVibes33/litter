[package]
name = "minimuxer"
version = "0.1.0"
edition = "2021"

[dependencies]
rusty_libimobiledevice = { path = "../rusty_libimobiledevice", features = [
  "static",
  "vendored",
], default-features = false }

idevice = { version = "0.1.29", features = ["full"] }

plist_plus = { path = "../plist_plus", features = ["static", "vendored"] }
plist = "1"
swift-bridge = { git = "https://github.com/naturecodevoid/swift-bridge" } # TODO: change to official repo once https://github.com/chinedufn/swift-bridge/pull/209 is merged

log = "*"
fern = "0.7"

serde = "1.0"
serde_json = "1.0"

tokio = { version = "1.44", features = ["rt", "rt-multi-thread", "net"] }
once_cell = "1.21.1"


reqwest = { version = "0.12", features = ["blocking"] }
zip = "4.6.1"
chrono = "0.4"

[patch.crates-io]
openssl-src = { path = "../../../shared/rust-bridge/vendor/openssl-src-300.5.9" }
paste = { path = "../../../shared/rust-bridge/vendor/security-compat/paste" }
json = { path = "../../../shared/rust-bridge/vendor/security-compat/json" }
ansi_term = { path = "../../../shared/rust-bridge/vendor/security-compat/ansi_term" }
fxhash = { path = "../../../shared/rust-bridge/vendor/security-compat/fxhash" }
atomic-polyfill = { path = "../../../shared/rust-bridge/vendor/security-compat/atomic-polyfill" }

atty = { path = "../vendor/atty-compat" }
plist_plus = { path = "../plist_plus" }

[dev-dependencies]
env_logger = "0.11"

[build-dependencies]
swift-bridge-build = { git = "https://github.com/naturecodevoid/swift-bridge" } # TODO: change to official repo once https://github.com/chinedufn/swift-bridge/pull/209 is merged

[profile.release]
panic = "abort"

[lib]
crate-type = ["staticlib", "rlib"]
