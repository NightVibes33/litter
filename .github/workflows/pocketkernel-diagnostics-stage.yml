name: PocketKernel Xcode Diagnostics Stage

on:
  push:
    branches:
      - pocketkernel/apple-foundation-models
    paths:
      - '.github/workflows/pocketkernel-diagnostics-stage.yml'

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pocketkernel/apple-foundation-models
          fetch-depth: 0

      - name: Surface archive compiler errors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/ios-unsigned-ipa.yml')
          text = workflow.read_text()
          old = "\n".join([
              '          if [ "$archive_status" -ne 0 ]; then',
              '            exit "$archive_status"',
              '          fi',
              '',
          ])
          new = "\n".join([
              '          if [ "$archive_status" -ne 0 ]; then',
              '            echo "::group::Xcode compiler diagnostics"',
              "            grep -nE '(^|[[:space:]])(error:|fatal error:)|SwiftCompile|BUILD FAILED|Command SwiftCompile failed|Command CompileSwift failed' build/xcodebuild-archive.log | tail -n 400 || true",
              '            echo "::endgroup::"',
              '            exit "$archive_status"',
              '          fi',
              '',
          ])
          if old not in text:
              raise SystemExit('archive failure block not found')
          workflow.write_text(text.replace(old, new, 1))
          Path('.github/workflows/pocketkernel-diagnostics-stage.yml').unlink()
          PY

      - name: Commit and publish diagnostic tag
        run: |
          git config user.name "PocketKernel CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Surface Xcode compiler errors in iOS builds"
          git tag -f pocketkernel-xcode-diagnostics-stage-1
          git push --force origin refs/tags/pocketkernel-xcode-diagnostics-stage-1
          echo "STAGED_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
