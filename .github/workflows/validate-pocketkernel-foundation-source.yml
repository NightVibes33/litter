name: Validate PocketKernel Foundation Source

on:
  push:
    branches:
      - pocketkernel-foundation-models

permissions:
  contents: write

concurrency:
  group: validate-pocketkernel-foundation-source
  cancel-in-progress: true

jobs:
  parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pocketkernel-foundation-models
      - name: Parse changed Swift sources
        run: |
          set -euo pipefail
          files=(
            apps/ios/Sources/Litter/Models/AIProviderModels.swift
            apps/ios/Sources/Litter/Models/AIProviderStore.swift
            apps/ios/Sources/Litter/Models/AppleFoundationModelService.swift
            apps/ios/Sources/Litter/Models/AppleIntelligenceChatStore.swift
            apps/ios/Sources/Litter/Views/AIProviderSettingsView.swift
            apps/ios/Sources/Litter/Views/AppleIntelligenceChatView.swift
            apps/ios/Sources/Litter/Views/HomeComposerView.swift
            apps/ios/Sources/Litter/Views/HomeModelChip.swift
          )
          ! grep -R '\\\"Apple Intelligence\\\"' "${files[@]}"
          for file in "${files[@]}"; do
            swiftc -parse "$file"
          done
      - name: Verify local-first routing markers
        run: |
          set -euo pipefail
          grep -q 'routingMode: .appleIntelligence' apps/ios/Sources/Litter/Models/AIProviderModels.swift
          grep -q 'AppleIntelligenceChatView(initialPrompt: pendingApplePrompt)' apps/ios/Sources/Litter/Views/HomeComposerView.swift
          grep -q 'return "Apple Intelligence"' apps/ios/Sources/Litter/Views/HomeModelChip.swift
      - name: Remove one-shot validator
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          path='.github/workflows/validate-pocketkernel-foundation-source.yml'
          sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/$path?ref=pocketkernel-foundation-models" --jq .sha)"
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/contents/$path" \
            -f message='chore: remove one-shot Foundation source validator' \
            -f sha="$sha" \
            -f branch='pocketkernel-foundation-models'
