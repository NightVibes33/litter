name: SideStore dependency security build

on:
  pull_request:
    paths:
      - '.github/workflows/security-dependencies.yml'
      - 'ThirdParty/SideStore/**/Cargo.toml'
      - 'ThirdParty/SideStore/**/Cargo.lock'
      - 'ThirdParty/SideStore/vendor/**'
      - 'shared/rust-bridge/vendor/security-compat/**'
      - 'ThirdParty/Feather/**'
      - 'tools/swift-security-check/**'
      - 'tools/scripts/audit-swift-dependencies.py'
      - 'shared/rust-bridge/vendor/rquickjs-sys-0.9.0/quickjs/docs/**'
      - 'tools/scripts/package.json'
      - 'tools/scripts/package-lock.json'
      - 'services/testflight-signup/**'
      - 'services/push-proxy/**'
      - 'tools/scripts/build-sidestore-minimuxer.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios-native:
    runs-on: macos-26-intel
    timeout-minutes: 60
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      LITTER_MINIMUXER_SKIP_SIM: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - name: Install native build tools
        run: brew install autoconf automake libtool cmake ninja pkgconf llvm
      - name: Verify locked dependency resolution
        run: |
          cargo metadata --locked --no-deps --format-version 1 --manifest-path ThirdParty/SideStore/minimuxer/Cargo.toml > /dev/null
          cargo metadata --locked --no-deps --format-version 1 --manifest-path ThirdParty/SideStore/Source/Dependencies/minimuxer/RustBridge/Cargo.toml > /dev/null
      - name: Test optional classic pairing certificate backend
        run: cargo test --locked --manifest-path ThirdParty/SideStore/vendor/idevice-0.1.56/Cargo.toml --features full ca::tests --lib
      - name: Build both iOS native libraries
        run: tools/scripts/build-sidestore-minimuxer.sh

  swift:
    runs-on: macos-26-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build and run fixed Swift dependency graph
        run: swift run --package-path tools/swift-security-check DependencyCheck
      - name: Resolve Feather app packages with fixed dependencies
        run: xcodebuild -resolvePackageDependencies -project ThirdParty/Feather/Source/Feather.xcodeproj -scheme Feather
      - name: Audit resolved Swift dependency commits
        run: python3 tools/scripts/audit-swift-dependencies.py --output "$RUNNER_TEMP/swift-security.json"
      - name: Save resolved Swift security graph
        uses: actions/upload-artifact@v4
        with:
          name: swift-security-resolution
          path: |
            tools/swift-security-check/Package.resolved
            ThirdParty/Feather/Source/Feather.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
      - name: Test hardened Feather archive destination validation
        run: swift test --package-path ThirdParty/Feather/Source/Zip

  documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: shared/rust-bridge/vendor/rquickjs-sys-0.9.0/quickjs/docs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Audit repository tooling dependencies
        working-directory: tools/scripts
        run: npm audit --package-lock-only --ignore-scripts
      - name: Install locked documentation dependencies
        run: npm ci --ignore-scripts
      - name: Audit all documentation dependencies
        run: npm audit
      - name: Verify brace API compatibility and safety bounds
        run: npm run test:security
      - name: Build documentation
        run: npm run build

  services:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        service: [testflight-signup, push-proxy]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npm audit
      - run: npx tsc --noEmit
