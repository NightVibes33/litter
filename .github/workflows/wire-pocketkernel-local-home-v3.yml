name: Wire PocketKernel Local Home V3

on:
  push:
    branches:
      - pocketkernel-foundation-models

permissions:
  contents: write

concurrency:
  group: wire-pocketkernel-local-home-v3
  cancel-in-progress: true

jobs:
  wire:
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ steps.commit.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pocketkernel-foundation-models

      - name: Patch local-first routing
        run: python3 tools/scripts/wire-pocketkernel-local-home.py

      - name: Create remote commit object
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/scripts/create-pocketkernel-patch-commit.py

      - name: Show handoff commit
        run: echo "REMOTE_COMMIT_SHA=${{ steps.commit.outputs.commit_sha }}"
