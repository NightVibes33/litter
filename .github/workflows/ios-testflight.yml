name: iOS TestFlight Release

on:
  workflow_dispatch:
    inputs:
      beta_group_names:
        description: "Comma-separated TestFlight beta groups"
        required: false
        default: "Internal Testers,Beta Testers"
        type: string
      wait_for_processing:
        description: "Wait for ASC processing before finishing"
        required: false
        default: true
        type: boolean
  push:
    branches:
      - main
    paths:
      - 'apps/ios/**'
      - 'shared/rust-bridge/**'
      - 'shared/third_party/codex/**'
      - 'shared/third_party/ghostty/**'
      - 'patches/codex/**'
      - 'patches/ghostty/**'
      - 'tools/scripts/checkout-submodules-with-retry.sh'
      - 'tools/scripts/patch-ios-testflight-fast-project.py'
      - 'apps/ios/scripts/testflight-upload.sh'
      - '.github/workflows/ios-testflight.yml'

concurrency:
  group: ios-testflight-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  LITTER_TESTFLIGHT_FAST: "1"
  LITTER_TESTFLIGHT_SKIP_EMEXDE: "1"
  LITTER_SKIP_ALLEYCAT_UPDATE: "1"
  INCLUDE_LIVEPROCESS: "0"
  SUBMODULE_CHECKOUT_JOBS: "3"
  SUBMODULE_CHECKOUT_PATHS: "shared/third_party/codex shared/third_party/ghostty"

jobs:
  testflight-preflight:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip mobile-release]') }}
    runs-on: macos-26-intel
    timeout-minutes: 10
    steps:
      - name: Validate App Store Connect app record
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_P8_B64: ${{ secrets.ASC_PRIVATE_KEY_P8_B64 }}
          TESTFLIGHT_SIGNING_SOURCE: asc-generated
          IOS_DIST_CERT_P12_B64: ${{ secrets.IOS_DIST_CERT_P12_B64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY_P8_B64; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required secret: $name" >&2
              exit 1
            fi
          done

          brew install jq
          HOMEBREW_NO_AUTO_UPDATE=0 brew install asc

          ASC_KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          echo "$ASC_PRIVATE_KEY_P8_B64" | base64 --decode > "$ASC_KEY_PATH"
          chmod 600 "$ASC_KEY_PATH"
          export ASC_PRIVATE_KEY_PATH="$ASC_KEY_PATH"

          app_json="$(asc apps list \
            --bundle-id com.sigkitten.litter.39A8Q3T3TR \
            --output json)"
          app_id="$(echo "$app_json" | jq -r '.data[0].id // empty')"
          if [[ -z "$app_id" ]]; then
            echo "Missing App Store Connect app record for bundle id com.sigkitten.litter.39A8Q3T3TR." >&2
            echo "Create it in App Store Connect before running TestFlight upload." >&2
            exit 1
          fi
          echo "Found App Store Connect app id: $app_id"

          if [[ "${TESTFLIGHT_SIGNING_SOURCE:-}" == "p12" ]]; then
            for name in IOS_DIST_CERT_P12_B64 IOS_DIST_CERT_PASSWORD; do
              if [[ -z "${!name:-}" ]]; then
                echo "Missing required p12 signing secret: $name" >&2
                exit 1
              fi
            done

            CERT_PATH="$RUNNER_TEMP/preflight-dist-cert.p12"
            KEYCHAIN_PATH="$RUNNER_TEMP/preflight-signing.keychain-db"
            KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
            IMPORT_LOG="$RUNNER_TEMP/preflight-p12-import.log"
            echo "$IOS_DIST_CERT_P12_B64" | base64 --decode > "$CERT_PATH"
            security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            import_p12_with_password_variants() {
              local decoded_password=""
              if security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$IOS_DIST_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security >"$IMPORT_LOG" 2>&1; then
                echo "Validated p12 import with configured password."
                return 0
              fi
              if security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "" -T /usr/bin/codesign -T /usr/bin/security >"$IMPORT_LOG" 2>&1; then
                echo "Validated p12 import with an empty password."
                return 0
              fi
              if decoded_password="$(printf '%s' "$IOS_DIST_CERT_PASSWORD" | base64 --decode 2>/dev/null)" && [[ -n "$decoded_password" && "$decoded_password" != "$IOS_DIST_CERT_PASSWORD" ]]; then
                if security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$decoded_password" -T /usr/bin/codesign -T /usr/bin/security >"$IMPORT_LOG" 2>&1; then
                  echo "Validated p12 import with a base64-decoded password."
                  return 0
                fi
              fi
              echo "Unable to import IOS_DIST_CERT_P12_B64 with the stored password variants." >&2
              cat "$IMPORT_LOG" >&2
              return 1
            }
            import_p12_with_password_variants
          fi

  prepare-release-assets:
    needs: testflight-preflight
    runs-on: macos-26-intel
    timeout-minutes: 240
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      SCCACHE_BUCKET: rust-cache
      SCCACHE_ENDPOINT: ${{ secrets.SCCACHE_R2_ENDPOINT }}
      SCCACHE_REGION: auto
      SCCACHE_S3_USE_SSL: "true"
      SCCACHE_S3_KEY_PREFIX: ci/ios-release
      SCCACHE_LOG: info
      AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_R2_SECRET_ACCESS_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Checkout submodules with retry
        run: |
          set -euo pipefail
          tools/scripts/checkout-submodules-with-retry.sh

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'

      - name: Install build dependencies
        run: brew install xcodegen meson ninja llvm lld

      - name: Setup Zig (libghostty build)
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios,i686-unknown-linux-musl

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ios-cargo-registry-${{ runner.os }}-${{ hashFiles('shared/rust-bridge/Cargo.lock', 'ThirdParty/SideStore/minimuxer/Cargo.lock') }}
          restore-keys: |
            ios-cargo-registry-${{ runner.os }}-

      - name: Restore TestFlight Rust generated cache
        id: rust_generated_cache
        uses: actions/cache/restore@v4
        with:
          path: |
            apps/ios/GeneratedRust
            apps/ios/Sources/Litter/Bridge/UniFFICodexClient.generated.swift
          key: ios-testflight-rust-generated-mobile-release-v1-${{ runner.os }}-${{ hashFiles('apps/ios/scripts/build-rust.sh', 'apps/ios/scripts/build-ghostty.sh', 'apps/ios/scripts/sync-ghostty.sh', 'apps/ios/scripts/sync-codex.sh', 'shared/rust-bridge/Cargo.lock', 'shared/rust-bridge/Cargo.toml', 'shared/rust-bridge/codex-mobile-client/Cargo.toml', 'shared/rust-bridge/codex-mobile-client/src/**', 'shared/rust-bridge/codex-slingshot/Cargo.toml', 'shared/rust-bridge/codex-slingshot/src/**', 'patches/codex/**', 'patches/ghostty/**', 'shared/third_party/codex/**', 'shared/third_party/ghostty/**') }}
          restore-keys: |
            ios-testflight-rust-generated-mobile-release-v1-${{ runner.os }}-

      - name: Validate TestFlight Rust generated cache
        id: rust_generated_valid
        run: |
          set -euo pipefail
          if [[ "${{ steps.rust_generated_cache.outputs.cache-hit }}" != "true" ]]; then
            echo "hit=false" >> "$GITHUB_OUTPUT"
            echo "No exact TestFlight Rust generated cache hit; rebuilding generated Rust assets instead of trusting a restore-key fallback."
            exit 0
          fi

          required=(
            apps/ios/GeneratedRust/ios-device/libcodex_mobile_client.a
            apps/ios/GeneratedRust/ios-device/libghostty.a
            apps/ios/GeneratedRust/Headers/ghostty.h
            apps/ios/GeneratedRust/Headers/codex_mobile_clientFFI.h
            apps/ios/GeneratedRust/Headers/codex_mobile_clientFFI.modulemap
            apps/ios/GeneratedRust/Headers/module.modulemap
            apps/ios/GeneratedRust/.swift-bindings.hash
            apps/ios/Sources/Litter/Bridge/UniFFICodexClient.generated.swift
          )
          missing=0
          for path in "${required[@]}"; do
            if [[ ! -s "$path" ]]; then
              echo "missing generated asset: $path"
              missing=1
            fi
          done
          if [[ "$missing" == "0" ]]; then
            echo "hit=true" >> "$GITHUB_OUTPUT"
          else
            echo "hit=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup sccache
        if: env.SCCACHE_ENDPOINT != '' && env.AWS_ACCESS_KEY_ID != '' && env.AWS_SECRET_ACCESS_KEY != ''
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Prime sccache
        if: env.SCCACHE_ENDPOINT != '' && env.AWS_ACCESS_KEY_ID != '' && env.AWS_SECRET_ACCESS_KEY != ''
        run: |
          export SCCACHE_ERROR_LOG="$RUNNER_TEMP/sccache-ios.log"
          rm -f "$SCCACHE_ERROR_LOG"
          sccache --stop-server || true
          sccache --start-server
          sccache --show-stats || true

      - name: Normalize emexDE generated Swift imports for TestFlight prep
        if: env.LITTER_TESTFLIGHT_SKIP_EMEXDE != '1'
        run: |
          set -euo pipefail
          python3 tools/scripts/patch-emexde-generated-swift-imports-for-ios-ci.py

      - name: Prepare iOS release assets
        env:
          CARGO_INCREMENTAL: "0"
          CARGO_BUILD_JOBS: "2"
          IOS_RUST_PROFILE: mobile-release
        run: |
          set -euo pipefail
          if [[ -n "${SCCACHE_ENDPOINT:-}" && -n "${AWS_ACCESS_KEY_ID:-}" && -n "${AWS_SECRET_ACCESS_KEY:-}" ]] && command -v sccache >/dev/null 2>&1; then
            export RUSTC_WRAPPER=sccache
            export SCCACHE_ERROR_LOG="$RUNNER_TEMP/sccache-ios.log"
            trap 'status=$?; echo "==> sccache stats"; sccache --show-stats || true; if [ -f "$SCCACHE_ERROR_LOG" ]; then echo "==> sccache error log"; tail -200 "$SCCACHE_ERROR_LOG" || true; fi; exit $status' EXIT
            sccache --zero-stats || true
          else
            echo "==> sccache remote cache is not configured; building without RUSTC_WRAPPER"
            export SCCACHE_DISABLE=1
            unset RUSTC_WRAPPER SCCACHE_BUCKET SCCACHE_ENDPOINT SCCACHE_REGION SCCACHE_S3_KEY_PREFIX SCCACHE_S3_USE_SSL
            unset AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN AWS_PROFILE
          fi
          if [[ "${LITTER_TESTFLIGHT_FAST:-0}" == "1" ]]; then
            python3 tools/scripts/patch-ios-testflight-fast-project.py
          fi
          if [[ "${{ steps.rust_generated_valid.outputs.hit }}" == "true" ]]; then
            echo "==> Using cached TestFlight Rust generated assets"
          else
            ./apps/ios/scripts/build-rust.sh --preserve-current --device-only
          fi
          if [[ "${SCCACHE_DISABLE:-0}" == "1" ]]; then
            make RUSTC_WRAPPER= SCCACHE_BUCKET= SCCACHE_ENDPOINT= AWS_ACCESS_KEY_ID= AWS_SECRET_ACCESS_KEY= alpine-fs xcgen
          else
            make alpine-fs xcgen
          fi
          if [[ "${SCCACHE_DISABLE:-0}" != "1" ]] && command -v sccache >/dev/null 2>&1; then
            echo "==> sccache stats after iOS release prep"
            sccache --show-stats || true
          fi

      - name: Save TestFlight Rust generated cache
        if: steps.rust_generated_valid.outputs.hit != 'true' && steps.rust_generated_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            apps/ios/GeneratedRust
            apps/ios/Sources/Litter/Bridge/UniFFICodexClient.generated.swift
          key: ${{ steps.rust_generated_cache.outputs.cache-primary-key }}

      - name: Restore KittyStore minimuxer bridge cache
        if: env.LITTER_TESTFLIGHT_FAST != '1'
        id: minimuxer_bridge_cache
        uses: actions/cache/restore@v4
        with:
          path: |
            apps/ios/GeneratedRust/ios-device/libminimuxer-ios.a
            apps/ios/Sources/Litter/Generated/Minimuxer
            apps/ios/GeneratedRust/Headers/Minimuxer
            ThirdParty/SideStore/Source/Dependencies/minimuxer/RustBridge/lib/RustBridge.xcframework
            ThirdParty/SideStore/minimuxer/generated
            ThirdParty/SideStore/minimuxer/target/libminimuxer-ios.a
            ~/.cargo/bin/bindgen
          key: ios-minimuxer-bridge-v1-${{ runner.os }}-xcode26-ios18-${{ hashFiles('tools/scripts/build-sidestore-minimuxer.sh', 'ThirdParty/SideStore/minimuxer/Cargo.lock', 'ThirdParty/SideStore/minimuxer/Cargo.toml', 'ThirdParty/SideStore/minimuxer/src/**', 'ThirdParty/SideStore/Source/Dependencies/minimuxer/RustBridge/Cargo.lock', 'ThirdParty/SideStore/Source/Dependencies/minimuxer/RustBridge/Cargo.toml', 'ThirdParty/SideStore/Source/Dependencies/minimuxer/RustBridge/src/**') }}

      - name: Check KittyStore minimuxer bridge cache
        if: env.LITTER_TESTFLIGHT_FAST != '1'
        id: minimuxer_bridge_prebuilt
        run: |
          set -euo pipefail
          if [ "${{ steps.minimuxer_bridge_cache.outputs.cache-hit }}" != "true" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "No exact KittyStore minimuxer bridge cache hit."
            exit 0
          fi

          missing=0
          require_nonempty() {
            local path="$1"
            if [ ! -s "$path" ]; then
              echo "Missing cached minimuxer output: $path"
              missing=1
            else
              ls -lh "$path"
            fi
          }
          require_nonempty apps/ios/GeneratedRust/ios-device/libminimuxer-ios.a
          require_nonempty apps/ios/Sources/Litter/Generated/Minimuxer/SwiftBridgeCore.generated.swift
          require_nonempty apps/ios/Sources/Litter/Generated/Minimuxer/minimuxer.generated.swift
          require_nonempty apps/ios/Sources/Litter/Generated/Minimuxer/minimuxer-helpers.generated.swift
          require_nonempty apps/ios/GeneratedRust/Headers/Minimuxer/SwiftBridgeCore.h
          require_nonempty apps/ios/GeneratedRust/Headers/Minimuxer/minimuxer.h
          require_nonempty apps/ios/GeneratedRust/Headers/Minimuxer/minimuxer-Bridging-Header.h
          require_nonempty apps/ios/GeneratedRust/Headers/Minimuxer/module.modulemap
          require_nonempty ThirdParty/SideStore/Source/Dependencies/minimuxer/RustBridge/lib/RustBridge.xcframework/ios-arm64/librust_bridge.a
          if ! grep -q "startWithLogger" apps/ios/Sources/Litter/Generated/Minimuxer/minimuxer.generated.swift; then
            echo "Cached minimuxer Swift bridge is stale: missing startWithLogger."
            missing=1
          fi
          if ! grep -q "installIpa" apps/ios/Sources/Litter/Generated/Minimuxer/minimuxer.generated.swift; then
            echo "Cached minimuxer Swift bridge is stale: missing installIpa."
            missing=1
          fi
          if [ "$missing" -eq 0 ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Using cached KittyStore minimuxer bridge outputs."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Cached KittyStore minimuxer bridge outputs are incomplete; rebuilding."
          fi

      - name: Install KittyStore minimuxer rebuild dependencies
        if: env.LITTER_TESTFLIGHT_FAST != '1' && steps.minimuxer_bridge_prebuilt.outputs.available != 'true'
        run: |
          set -euo pipefail
          brew list cmake >/dev/null 2>&1 || brew install cmake
          brew list ninja >/dev/null 2>&1 || brew install ninja
          brew list pkgconf >/dev/null 2>&1 || brew install pkgconf
          brew list llvm >/dev/null 2>&1 || brew install llvm

      - name: Build KittyStore minimuxer bridge
        if: env.LITTER_TESTFLIGHT_FAST != '1' && steps.minimuxer_bridge_prebuilt.outputs.available != 'true'
        run: |
          set -euo pipefail
          time tools/scripts/build-sidestore-minimuxer.sh

      - name: Save KittyStore minimuxer bridge cache
        if: env.LITTER_TESTFLIGHT_FAST != '1' && steps.minimuxer_bridge_cache.outputs.cache-hit != 'true' && steps.minimuxer_bridge_prebuilt.outputs.available != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            apps/ios/GeneratedRust/ios-device/libminimuxer-ios.a
            apps/ios/Sources/Litter/Generated/Minimuxer
            apps/ios/GeneratedRust/Headers/Minimuxer
            ThirdParty/SideStore/Source/Dependencies/minimuxer/RustBridge/lib/RustBridge.xcframework
            ThirdParty/SideStore/minimuxer/generated
            ThirdParty/SideStore/minimuxer/target/libminimuxer-ios.a
            ~/.cargo/bin/bindgen
          key: ${{ steps.minimuxer_bridge_cache.outputs.cache-primary-key }}

      - name: Restore emexDE CoreCompiler artifact cache
        if: env.LITTER_TESTFLIGHT_SKIP_EMEXDE != '1'
        id: emexde_corecompiler_cache
        uses: actions/cache/restore@v4
        with:
          path: ThirdParty/EmexDE/Source/CoreCompiler/CoreCompilerSupportLibs
          key: ios-emexde-corecompiler-artifacts-v1-${{ runner.os }}-${{ hashFiles('tools/scripts/prepare-emexde-corecompiler-artifacts.sh', 'ThirdParty/EmexDE/Source/CoreCompiler/**/*.h', 'ThirdParty/EmexDE/Source/CoreCompiler/**/*.m', 'ThirdParty/EmexDE/Source/CoreCompiler/**/*.mm', 'ThirdParty/EmexDE/Source/CoreCompiler/**/*.swift') }}

      - name: Check emexDE CoreCompiler artifact cache
        if: env.LITTER_TESTFLIGHT_SKIP_EMEXDE != '1'
        id: emexde_corecompiler_prebuilt
        run: |
          set -euo pipefail
          support_source="ThirdParty/EmexDE/Source/CoreCompiler/CoreCompilerSupportLibs"
          if [ "${{ steps.emexde_corecompiler_cache.outputs.cache-hit }}" != "true" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "No exact emexDE CoreCompiler artifact cache hit."
            exit 0
          fi
          missing=0
          require_nonempty() {
            local path="$1"
            if [ ! -s "$path" ]; then
              echo "Missing cached CoreCompiler artifact: $path"
              missing=1
            else
              ls -lh "$path"
            fi
          }
          require_nonempty "$support_source/LLVM.xcframework/ios-arm64/llvm.a"
          require_nonempty "$support_source/LLVM.xcframework/ios-arm64/Headers/llvm/Support/Threading.h"
          swift_header_root="$support_source/LLVM.xcframework/ios-arm64/Headers"
          swift_header_marker="$swift_header_root/swift/.emexde-swift-header-branch"
          require_nonempty "$swift_header_root/swift/Basic/InitializeSwiftModules.h"
          require_nonempty "$swift_header_root/swift/FrontendTool/FrontendTool.h"
          require_nonempty "$swift_header_root/swift/Config.h"
          require_nonempty "$swift_header_root/clang/Basic/PathRemapper.h"
          require_nonempty "$swift_header_root/clang/CAS/CASOptions.h"
          require_nonempty "$swift_header_root/llvm/CAS/ActionCache.h"
          require_nonempty "$swift_header_root/llvm/Support/VirtualOutputBackend.h"
          require_nonempty "$swift_header_root/swift/Option/Options.inc"
          require_nonempty "$swift_header_root/swift/Runtime/CMakeConfig.h"
          require_nonempty "$swift_header_root/lld/Common/Version.inc"
          require_nonempty "$swift_header_marker"
          if [ -s "$swift_header_marker" ] && [ "$(cat "$swift_header_marker")" != "swift-6.0.3-RELEASE" ]; then
            echo "Cached Swift compiler header overlay is for $(cat "$swift_header_marker"), expected swift-6.0.3-RELEASE."
            missing=1
          fi
          if [ -s "$swift_header_root/swift/AST/Identifier.h" ] && grep -q 'getTrailingObjects(NumArgs)' "$swift_header_root/swift/AST/Identifier.h"; then
            echo "Cached Swift compiler headers use the newer TrailingObjects API and are incompatible with vendored LLVM 19."
            missing=1
          fi
          if [ -f "$swift_header_root/module.modulemap" ]; then
            echo "Cached Swift root module map conflicts with Xcode public header copy."
            missing=1
          fi
          if ! find "$support_source" -maxdepth 1 -type f -name 'lib_Compiler*.dylib' -print -quit | grep -q .; then
            echo "Cached CoreCompiler support dylibs are missing."
            missing=1
          fi
          if [ "$missing" -eq 0 ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Using cached emexDE CoreCompiler support artifacts."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Cached emexDE CoreCompiler artifacts are incomplete; rebuilding."
          fi

      - name: Prepare emexDE CoreCompiler artifacts
        if: env.LITTER_TESTFLIGHT_SKIP_EMEXDE != '1' && steps.emexde_corecompiler_prebuilt.outputs.available != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          time tools/scripts/prepare-emexde-corecompiler-artifacts.sh

      - name: Save emexDE CoreCompiler artifact cache
        if: env.LITTER_TESTFLIGHT_SKIP_EMEXDE != '1' && steps.emexde_corecompiler_cache.outputs.cache-hit != 'true' && steps.emexde_corecompiler_prebuilt.outputs.available != 'true'
        uses: actions/cache/save@v4
        with:
          path: ThirdParty/EmexDE/Source/CoreCompiler/CoreCompilerSupportLibs
          key: ${{ steps.emexde_corecompiler_cache.outputs.cache-primary-key }}

      - name: Patch emexDE CoreCompiler Swift frontend for TestFlight CI
        if: env.LITTER_TESTFLIGHT_SKIP_EMEXDE != '1'
        run: |
          set -euo pipefail
          python3 tools/scripts/patch-emexde-corecompiler-for-ios-ci.py

      - name: Package iOS release prep artifact
        run: |
          set -euo pipefail
          mkdir -p .ci-prep/ios
          paths=(
            apps/ios/Resources/fs.tar.gz
            apps/ios/Resources/fs.version
            apps/ios/GeneratedRust/ios-device
            apps/ios/GeneratedRust/Headers
            apps/ios/GeneratedRust/.swift-bindings.hash
            apps/ios/Sources/Litter/Bridge/UniFFICodexClient.generated.swift
          )
          if [[ "${LITTER_TESTFLIGHT_FAST:-0}" != "1" ]]; then
            paths+=(
              apps/ios/Sources/Litter/Generated/Minimuxer
              ThirdParty/SideStore/Source/Dependencies/minimuxer/RustBridge/lib/RustBridge.xcframework
              ThirdParty/SideStore/minimuxer/generated
              ThirdParty/SideStore/minimuxer/target/libminimuxer-ios.a
            )
          fi
          if [[ "${LITTER_TESTFLIGHT_SKIP_EMEXDE:-0}" != "1" ]]; then
            paths+=(ThirdParty/EmexDE/Source/CoreCompiler/CoreCompilerSupportLibs)
          fi
          tar -czf .ci-prep/ios/ios-release-prep.tgz -C . "${paths[@]}"

      - name: Upload iOS release prep artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-prep
          path: .ci-prep/ios
          if-no-files-found: error

  upload-testflight:
    needs: prepare-release-assets
    runs-on: macos-26-intel
    timeout-minutes: 150
    environment: release
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      EXPORT_SIGNING_STYLE: manual
      TESTFLIGHT_SIGNING_SOURCE: asc-generated
      SCCACHE_BUCKET: rust-cache
      SCCACHE_ENDPOINT: ${{ secrets.SCCACHE_R2_ENDPOINT }}
      SCCACHE_REGION: auto
      SCCACHE_S3_USE_SSL: "true"
      SCCACHE_S3_KEY_PREFIX: ci/ios-release
      SCCACHE_LOG: info
      AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_R2_SECRET_ACCESS_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Checkout submodules with retry
        run: |
          set -euo pipefail
          tools/scripts/checkout-submodules-with-retry.sh

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'

      - name: Validate required secrets
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_P8_B64: ${{ secrets.ASC_PRIVATE_KEY_P8_B64 }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_DIST_CERT_P12_B64: ${{ secrets.IOS_DIST_CERT_P12_B64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_APP_STORE_PROFILE_B64: ${{ secrets.IOS_APP_STORE_PROFILE_B64 }}
          IOS_LIVE_ACTIVITY_APP_STORE_PROFILE_B64: ${{ secrets.IOS_LIVE_ACTIVITY_APP_STORE_PROFILE_B64 }}
          IOS_LIVEPROCESS_APP_STORE_PROFILE_B64: ${{ secrets.IOS_LIVEPROCESS_APP_STORE_PROFILE_B64 }}
          IOS_WATCH_APP_STORE_PROFILE_B64: ${{ secrets.IOS_WATCH_APP_STORE_PROFILE_B64 }}
          IOS_WATCH_COMP_APP_STORE_PROFILE_B64: ${{ secrets.IOS_WATCH_COMP_APP_STORE_PROFILE_B64 }}
        run: |
          set -euo pipefail
          required=(
            ASC_KEY_ID
            ASC_ISSUER_ID
            ASC_PRIVATE_KEY_P8_B64
            IOS_TEAM_ID
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required secret: $name" >&2
              exit 1
            fi
          done

      - name: Install build dependencies
        run: |
          set -euo pipefail
          brew install xcodegen jq
          HOMEBREW_NO_AUTO_UPDATE=0 brew install asc
          xcodebuild -version
          asc --version

      - name: Download iOS release prep artifact
        uses: actions/download-artifact@v4
        with:
          name: ios-release-prep
          path: .ci-prep/ios

      - name: Restore iOS release prep
        run: |
          IOS_PREP_ROOT=.ci-prep/ios
          if [ -d "$IOS_PREP_ROOT/ios" ]; then
            IOS_PREP_ROOT="$IOS_PREP_ROOT/ios"
          fi

          tar -xzf "$IOS_PREP_ROOT/ios-release-prep.tgz" -C .

      - name: Normalize emexDE generated Swift imports for TestFlight archive
        if: env.LITTER_TESTFLIGHT_SKIP_EMEXDE != '1'
        run: |
          set -euo pipefail
          python3 tools/scripts/patch-emexde-generated-swift-imports-for-ios-ci.py

      - name: Patch emexDE CoreCompiler Swift frontend for TestFlight archive
        if: env.LITTER_TESTFLIGHT_SKIP_EMEXDE != '1'
        run: |
          set -euo pipefail
          python3 tools/scripts/patch-emexde-corecompiler-for-ios-ci.py

      - name: Apply TestFlight fast project mode
        if: env.LITTER_TESTFLIGHT_FAST == '1'
        run: |
          set -euo pipefail
          python3 tools/scripts/patch-ios-testflight-fast-project.py

      - name: Decode App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY_P8_B64: ${{ secrets.ASC_PRIVATE_KEY_P8_B64 }}
        run: |
          set -euo pipefail
          ASC_KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          echo "$ASC_PRIVATE_KEY_P8_B64" | base64 --decode > "$ASC_KEY_PATH"
          chmod 600 "$ASC_KEY_PATH"
          echo "ASC_PRIVATE_KEY_PATH=$ASC_KEY_PATH" >> "$GITHUB_ENV"

      - name: Prepare generated App Store signing assets
        if: env.EXPORT_SIGNING_STYLE == 'manual' && env.TESTFLIGHT_SIGNING_SOURCE == 'asc-generated'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          CERTIFICATE_TYPE: DISTRIBUTION
          REVOKE_EXISTING_LITTER_CI_DISTRIBUTION_CERTIFICATE_ON_LIMIT: "1"
          REVOKE_EXISTING_DISTRIBUTION_CERTIFICATES_ON_LIMIT: "0"
          REVOKE_NEWEST_DISTRIBUTION_CERTIFICATE_ON_LIMIT: "1"
          APP_BUNDLE_ID: com.sigkitten.litter.39A8Q3T3TR
          LIVE_ACTIVITY_BUNDLE_ID: com.sigkitten.litter.39A8Q3T3TR.liveactivity
          LIVEPROCESS_BUNDLE_ID: com.sigkitten.litter.39A8Q3T3TR.liveprocess
          WATCH_BUNDLE_ID: com.sigkitten.litter.39A8Q3T3TR.watchkitapp
          WATCH_COMP_BUNDLE_ID: com.sigkitten.litter.39A8Q3T3TR.watchkitapp.complications
          INCLUDE_LIVEPROCESS: "0"
        run: |
          set -euo pipefail
          tools/scripts/prepare-appstore-signing-assets.sh

      - name: Install p12 signing certificate and provisioning profiles
        if: env.EXPORT_SIGNING_STYLE == 'manual' && env.TESTFLIGHT_SIGNING_SOURCE == 'p12'
        env:
          IOS_DIST_CERT_P12_B64: ${{ secrets.IOS_DIST_CERT_P12_B64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_APP_STORE_PROFILE_B64: ${{ secrets.IOS_APP_STORE_PROFILE_B64 }}
          IOS_LIVE_ACTIVITY_APP_STORE_PROFILE_B64: ${{ secrets.IOS_LIVE_ACTIVITY_APP_STORE_PROFILE_B64 }}
          IOS_LIVEPROCESS_APP_STORE_PROFILE_B64: ${{ secrets.IOS_LIVEPROCESS_APP_STORE_PROFILE_B64 }}
          IOS_WATCH_APP_STORE_PROFILE_B64: ${{ secrets.IOS_WATCH_APP_STORE_PROFILE_B64 }}
          IOS_WATCH_COMP_APP_STORE_PROFILE_B64: ${{ secrets.IOS_WATCH_COMP_APP_STORE_PROFILE_B64 }}
        run: |
          set -euo pipefail

          CERT_PATH="$RUNNER_TEMP/dist-cert.p12"
          APP_PROFILE_PATH="$RUNNER_TEMP/app-store.mobileprovision"
          LIVE_ACTIVITY_PROFILE_PATH="$RUNNER_TEMP/live-activity-app-store.mobileprovision"
          LIVEPROCESS_PROFILE_PATH="$RUNNER_TEMP/liveprocess-app-store.mobileprovision"
          WATCH_PROFILE_PATH="$RUNNER_TEMP/watch-app-store.mobileprovision"
          WATCH_COMP_PROFILE_PATH="$RUNNER_TEMP/watch-complications-app-store.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"

          echo "$IOS_DIST_CERT_P12_B64" | base64 --decode > "$CERT_PATH"
          echo "$IOS_APP_STORE_PROFILE_B64" | base64 --decode > "$APP_PROFILE_PATH"
          echo "$IOS_LIVE_ACTIVITY_APP_STORE_PROFILE_B64" | base64 --decode > "$LIVE_ACTIVITY_PROFILE_PATH"
          echo "$IOS_LIVEPROCESS_APP_STORE_PROFILE_B64" | base64 --decode > "$LIVEPROCESS_PROFILE_PATH"
          echo "$IOS_WATCH_APP_STORE_PROFILE_B64" | base64 --decode > "$WATCH_PROFILE_PATH"
          echo "$IOS_WATCH_COMP_APP_STORE_PROFILE_B64" | base64 --decode > "$WATCH_COMP_PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -d user -s "$KEYCHAIN_PATH"
          import_p12_with_password_variants() {
            local decoded_password=""
            local import_log="$RUNNER_TEMP/p12-import.log"
            if security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$IOS_DIST_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security >"$import_log" 2>&1; then
              echo "Imported p12 with configured password."
              return 0
            fi
            if security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "" -T /usr/bin/codesign -T /usr/bin/security >"$import_log" 2>&1; then
              echo "Imported p12 with an empty password."
              return 0
            fi
            if decoded_password="$(printf '%s' "$IOS_DIST_CERT_PASSWORD" | base64 --decode 2>/dev/null)" && [[ -n "$decoded_password" && "$decoded_password" != "$IOS_DIST_CERT_PASSWORD" ]]; then
              if security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$decoded_password" -T /usr/bin/codesign -T /usr/bin/security >"$import_log" 2>&1; then
                echo "Imported p12 with a base64-decoded password."
                return 0
              fi
            fi
            echo "Unable to import IOS_DIST_CERT_P12_B64 with the stored password variants." >&2
            cat "$import_log" >&2
            return 1
          }
          import_p12_with_password_variants
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"

          install_profile() {
            local profile_path="$1"
            local env_name="$2"
            local profile_uuid profile_name

            profile_uuid="$(security cms -D -i "$profile_path" | plutil -extract UUID raw -)"
            profile_name="$(security cms -D -i "$profile_path" | plutil -extract Name raw -)"
            cp "$profile_path" "$HOME/Library/MobileDevice/Provisioning Profiles/$profile_uuid.mobileprovision"
            echo "$env_name=$profile_name" >> "$GITHUB_ENV"
          }

          install_profile "$APP_PROFILE_PATH" "APP_PROVISIONING_PROFILE_SPECIFIER"
          install_profile "$LIVE_ACTIVITY_PROFILE_PATH" "LIVE_ACTIVITY_PROVISIONING_PROFILE_SPECIFIER"
          install_profile "$LIVEPROCESS_PROFILE_PATH" "LIVEPROCESS_PROVISIONING_PROFILE_SPECIFIER"
          install_profile "$WATCH_PROFILE_PATH" "WATCH_PROVISIONING_PROFILE_SPECIFIER"
          install_profile "$WATCH_COMP_PROFILE_PATH" "WATCH_COMP_PROVISIONING_PROFILE_SPECIFIER"

      - name: Resolve release inputs
        run: |
          set -euo pipefail

          SCHEME="Litter"
          APP_BUNDLE_ID="com.sigkitten.litter.39A8Q3T3TR"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            BETA_GROUP_NAMES="${{ inputs.beta_group_names }}"
            if [[ "${{ inputs.wait_for_processing }}" == "true" ]]; then
              WAIT_FOR_PROCESSING="1"
            else
              WAIT_FOR_PROCESSING="1"
            fi
          else
            BETA_GROUP_NAMES="Internal Testers,Beta Testers"
            WAIT_FOR_PROCESSING="1"
          fi

          echo "SCHEME=$SCHEME" >> "$GITHUB_ENV"
          echo "APP_BUNDLE_ID=$APP_BUNDLE_ID" >> "$GITHUB_ENV"
          echo "BETA_GROUP_NAMES=$BETA_GROUP_NAMES" >> "$GITHUB_ENV"
          echo "WAIT_FOR_PROCESSING=$WAIT_FOR_PROCESSING" >> "$GITHUB_ENV"

      - name: Reset SwiftPM binary artifact cache
        run: |
          set -euo pipefail
          artifact_root="$HOME/Library/Caches/org.swift.swiftpm/artifacts"
          if [ -d "$artifact_root" ]; then
            find "$artifact_root" -maxdepth 1 -name 'https___github_com_stasel_WebRTC*' -exec rm -rf {} +
          fi

      - name: Build and upload TestFlight IPA
        env:
          SCHEME: Litter
          APP_BUNDLE_ID: com.sigkitten.litter.39A8Q3T3TR
          LIVE_ACTIVITY_BUNDLE_ID: com.sigkitten.litter.39A8Q3T3TR.liveactivity
          APP_STORE_APP_ID: ${{ secrets.IOS_APP_STORE_APP_ID }}
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          EXPORT_SIGNING_STYLE: manual
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          LITTER_TESTFLIGHT_FAST: "1"
          INCLUDE_LIVEPROCESS: "0"
          ALLOW_XCODE_EXPORTED_SEAL_WARNING: "0"
        run: |
          set -euo pipefail
          ./apps/ios/scripts/testflight-upload.sh

      - name: Commit TestFlight version bump
        run: |
          set -euo pipefail
          if git diff --quiet -- apps/ios/project.yml docs/releases/testflight-whats-new.md; then
            echo "No TestFlight version bump to commit."
            exit 0
          fi

          version="$(awk -F'"' '/MARKETING_VERSION:/ {print $2; exit}' apps/ios/project.yml)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/ios/project.yml docs/releases/testflight-whats-new.md
          git commit -m "ios: start TestFlight ${version} [skip mobile-release]"
          if ! git push origin "HEAD:${GITHUB_REF_NAME}"; then
            echo "WARNING: TestFlight version bump commit could not be pushed to ${GITHUB_REF_NAME}." >&2
            echo "         The build upload already completed; push the version bump manually if needed." >&2
          fi
