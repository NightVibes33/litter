name: Thread lifecycle Rust checks

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/thread-lifecycle.yml'
      - 'shared/rust-bridge/**'
      - 'shared/third_party/codex/**'
      - 'patches/codex/**'
      - 'tools/scripts/audit-rust-dependencies.py'
      - 'tools/rust-ios-compat-check/**'
  pull_request:
    paths:
      - '.github/workflows/thread-lifecycle.yml'
      - 'shared/rust-bridge/**'
      - 'shared/third_party/codex/**'
      - 'patches/codex/**'
      - 'tools/scripts/audit-rust-dependencies.py'
      - 'tools/rust-ios-compat-check/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          targets: aarch64-apple-ios

      - name: Apply repository Codex compatibility patches
        run: ./apps/ios/scripts/sync-codex.sh --preserve-current

      - name: Audit Rust packages and bundled OpenSSL baseline
        run: python3 tools/scripts/audit-rust-dependencies.py --output "$RUNNER_TEMP/rust-security.json"

      - name: Check Apple ABI dependencies before SDK builds
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, subprocess, tomllib
          root = json.loads(subprocess.check_output([
              'cargo', 'metadata', '--locked', '--format-version', '1',
              '--manifest-path', 'shared/rust-bridge/Cargo.toml',
              '--filter-platform', 'aarch64-apple-ios',
          ], text=True))
          active = {p['id'] for p in root['resolve']['nodes']}
          check = tomllib.loads(Path('tools/rust-ios-compat-check/Cargo.lock').read_text())
          names = {'libc', 'num_threads', 'rustix', 'nix', 'netdev', 'netwatch'}
          root_pins = {(p['name'], p['version']) for p in root['packages'] if p['name'] in names and p['id'] in active}
          check_pins = {(p['name'], p['version']) for p in check['package'] if p['name'] in names}
          assert root_pins == check_pins, 'Update the Apple ABI checker to match the mobile lockfile'
          PY
          cargo check --locked --manifest-path tools/rust-ios-compat-check/Cargo.toml --target aarch64-apple-ios

      - name: Check mobile client
        working-directory: shared/rust-bridge
        run: cargo check --locked -p codex-mobile-client --all-targets

      # Compatibility tests also verify the actual bundled OpenSSL release.
      - name: Run mobile client and Slingshot tests
        working-directory: shared/rust-bridge
        run: cargo test --locked -p codex-mobile-client -p codex-slingshot -p security-compat-tests --lib
