name: Build sandboxed iOS code-mode runtime

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v8:
    strategy:
      matrix:
        target: [aarch64-apple-ios, aarch64-apple-ios-sim]
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'
      - name: Restore pinned sandboxed V8 artifact
        id: cache
        uses: actions/cache@v4
        with:
          path: build/ios-code-mode
          key: ios-v8-sandbox-150.4.0-5c15a699-v1-${{ matrix.target }}-${{ hashFiles('tools/scripts/build-ios-code-mode-runtime.sh', 'patches/rusty-v8/**') }}
      - uses: actions/checkout@v4
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          repository: denoland/rusty_v8
          ref: 5c15a6995c9bb4bacd3e341b59fff32c909c80bf
          submodules: recursive
          path: build/rusty-v8-source
      - name: Install build dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: brew install ninja llvm
      - name: Build jitless sandboxed V8 from pinned source
        if: steps.cache.outputs.cache-hit != 'true'
        run: tools/scripts/build-ios-code-mode-runtime.sh "${{ matrix.target }}"
      - name: Verify complete archive
        run: |
          cd build/ios-code-mode/${{ matrix.target }}
          shasum -a 256 -c SHA256SUMS
          test -s librusty_v8.a.gz
          test -s src_binding.rs
      - uses: actions/upload-artifact@v4
        with:
          name: ios-code-mode-runtime-${{ matrix.target }}
          path: build/ios-code-mode/
          if-no-files-found: error
          compression-level: 0
