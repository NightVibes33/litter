name: Dispatch Apple Agent iOS Build

on:
  push:
    branches:
      - feature/apple-on-device-agent
    paths:
      - 'apps/ios/**'
      - '.github/workflows/apple-agent-ios-build-dispatch.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch-ios-build:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch unsigned IPA compile
        id: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run ios-unsigned-ipa.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$GITHUB_REF_NAME" \
            -f build_mode=fast-device

          run_id=""
          for attempt in $(seq 1 60); do
            run_id="$(
              gh run list \
                --repo "$GITHUB_REPOSITORY" \
                --workflow ios-unsigned-ipa.yml \
                --branch "$GITHUB_REF_NAME" \
                --event workflow_dispatch \
                --limit 20 \
                --json databaseId,headSha \
                --jq '.[] | select(.headSha == env.GITHUB_SHA) | .databaseId' \
                | head -n 1
            )"
            if [ -n "$run_id" ]; then
              break
            fi
            sleep 5
          done

          if [ -z "$run_id" ]; then
            echo "::error::Could not locate the dispatched iOS build run for $GITHUB_SHA" >&2
            exit 1
          fi

          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Dispatched iOS build run: $run_id"

      - name: Wait for iOS build and collect logs
        id: child
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.dispatch.outputs.run_id }}
        run: |
          set +e
          gh run watch "$RUN_ID" --repo "$GITHUB_REPOSITORY" --exit-status
          child_status=$?
          set -e

          echo "status=$child_status" >> "$GITHUB_OUTPUT"
          printf 'Child workflow run: %s\nExit status: %s\n' "$RUN_ID" "$child_status" > child-run-summary.txt

          gh run view "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --log-failed > child-failed-steps.log 2>&1 || true

          gh api \
            -H 'Accept: application/vnd.github+json' \
            "/repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/logs" \
            > child-run-logs.zip 2> child-log-download-error.txt || true

          mkdir -p child-run-logs
          if [ -s child-run-logs.zip ]; then
            unzip -q child-run-logs.zip -d child-run-logs || true
          fi

      - name: Upload iOS build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apple-agent-ios-build-diagnostics-${{ steps.dispatch.outputs.run_id }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            child-run-summary.txt
            child-failed-steps.log
            child-log-download-error.txt
            child-run-logs.zip
            child-run-logs/**

      - name: Mirror child build result
        if: always()
        env:
          CHILD_STATUS: ${{ steps.child.outputs.status }}
        run: |
          if [ -z "$CHILD_STATUS" ] || [ "$CHILD_STATUS" != "0" ]; then
            echo "::error::The dispatched unsigned IPA build failed." >&2
            exit 1
          fi
