name: Validate upstream Nyxian and SideStore integration

on:
  workflow_dispatch:
  push:
    branches:
      - upstream/nyxian-sidestore-integration
    paths:
      - '.gitmodules'
      - 'ThirdParty/EmexDE/**'
      - 'ThirdParty/SideStore/**'
      - 'apps/ios/Sources/EmexDEEmbedded/**'
      - 'tools/scripts/tests/test_nyxian_*.py'
      - 'tools/scripts/tests/test_sidestore_*.py'
      - 'ThirdParty/upstream-integration.json'
      - 'tools/scripts/verify-upstream-integration.py'
      - 'tools/scripts/verify-kittystore-integration.sh'
      - 'tools/scripts/audit-upstream-coverage.py'
      - 'tools/scripts/build-nyxian-buildkit-assets.sh'
      - 'tools/scripts/build-litter-buildkit-native.sh'
      - 'tools/scripts/package-buildkit-assets.sh'
      - 'tools/scripts/buildkit-native-source-fingerprint.sh'
      - '.github/workflows/buildkit-assets.yml'
      - '.github/workflows/upstream-integration.yml'

permissions:
  contents: read

jobs:
  quick-source-contracts:
    name: Check Alley Cat embedded source contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Check Nyxian and SideStore integration regressions
        run: |
          python3 -m unittest discover -s tools/scripts/tests -p 'test_nyxian_embedded_startup.py'
          python3 -m unittest discover -s tools/scripts/tests -p 'test_sidestore_catalog_contract.py'

  verify-upstreams:
    name: Verify exact source/dependency revisions
    runs-on: macos-26-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
      - name: Validate embedded Nyxian and SideStore upstream trees
        run: python3 tools/scripts/verify-upstream-integration.py
      - name: Generate complete upstream tracked-file coverage report
        run: python3 tools/scripts/audit-upstream-coverage.py --output build/upstream-coverage.json
      - name: Upload upstream coverage and compatibility report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upstream-source-coverage
          path: build/upstream-coverage.json
          if-no-files-found: warn
          retention-days: 14
      - name: Verify Alley Cat integration contracts
        run: |
          python3 -m unittest discover -s tools/scripts/tests -p 'test_nyxian_*.py'
          python3 -m unittest discover -s tools/scripts/tests -p 'test_sidestore_*.py'
          tools/scripts/verify-kittystore-integration.sh
      - name: Validate pinned-source BuildKit scripts
        run: |
          bash -n tools/scripts/build-nyxian-buildkit-assets.sh
          bash -n tools/scripts/build-litter-buildkit-native.sh
          bash -n tools/scripts/package-buildkit-assets.sh
          sh -n tools/scripts/buildkit-native-source-fingerprint.sh
          tools/scripts/buildkit-native-source-fingerprint.sh
      # Listing schemes with xcodebuild implicitly resolves every SwiftPM
      # dependency, potentially blocking this source-integrity job for hours.
      # Actual Xcode compilation stays in the separate unsigned IPA workflow.
      - name: Validate committed upstream Xcode scheme references
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          projects = (
              ("Nyxian", Path("ThirdParty/EmexDE/Source/Nyxian.xcodeproj"),
               {"Nyxian", "CoreCompiler", "MobileDevelopmentKit", "LiveProcess"}),
              ("SideStore", Path("ThirdParty/SideStore/Upstream/AltStore.xcodeproj"),
               {"SideStore", "SideStore - Release"}),
          )
          for label, project, required in projects:
              project_file = project / "project.pbxproj"
              source = project_file.read_text(encoding="utf-8")
              if "PBXNativeTarget" not in source:
                  raise SystemExit(f"{label}: Xcode project has no native targets")
              schemes = sorted((project / "xcshareddata/xcschemes").glob("*.xcscheme"))
              available = {item.stem for item in schemes}
              missing = required - available
              if missing:
                  raise SystemExit(f"{label}: missing expected upstream schemes: {sorted(missing)}")
              for scheme in schemes:
                  parsed = ET.parse(scheme)
                  if parsed.getroot().tag != "Scheme":
                      raise SystemExit(f"{label}: invalid root for {scheme}")
                  references = parsed.findall(
                      "./BuildAction/BuildActionEntries/BuildActionEntry/BuildableReference"
                  )
                  if scheme.stem in required and not references:
                      raise SystemExit(f"{label}: no build targets in {scheme}")
                  for reference in references:
                      identifier = reference.get("BlueprintIdentifier")
                      if not identifier:
                          raise SystemExit(f"{label}: missing blueprint ID in {scheme}")
                      container = reference.get("ReferencedContainer", "")
                      if container == f"container:{project.name}" and identifier not in source:
                          raise SystemExit(
                              f"{label}: target {identifier} in {scheme} is absent from project"
                          )
              print(f"{label}: validated {len(schemes)} shared Xcode schemes without package resolution")
          PY
