name: Probe live ShrubLibrary repository index

on:
  workflow_dispatch:
  push:
    branches:
      - upstream/nyxian-sidestore-integration
    paths:
      - '.github/workflows/shrublibrary-catalog-probe.yml'
      - 'ThirdParty/SideStore/Source/AltStore/Sources/AddSourceViewController.swift'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Inspect public index and client bundles without modifying the site
        env:
          SITE_URL: https://shrublibrary.pages.dev/
        run: |
          python3 - <<'PY'
          import json
          import re
          import urllib.parse
          import urllib.request
          from html.parser import HTMLParser
          class Links(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.assets=[]
              def handle_starttag(self, tag, attrs):
                  d=dict(attrs)
                  if tag=='script' and d.get('src'):
                      self.assets.append(d['src'])
                  if tag=='link' and d.get('href') and ('.js' in d['href'] or 'modulepreload' in d.get('rel','')):
                      self.assets.append(d['href'])
          root='https://shrublibrary.pages.dev/'
          def fetch(url, limit=6000000):
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (compatible; AlleyCat-upstream-audit/1.0)'})
              with urllib.request.urlopen(req,timeout=25) as res:
                  print('FETCH',res.status,res.headers.get('content-type'),url)
                  return res.read(limit)
          raw=fetch(root)
          html=raw.decode('utf-8','replace')
          print('HTML_LEN',len(html))
          print('HTML_HEAD',html[:7000])
          parser=Links()
          parser.feed(html)
          print('SCRIPT_ASSETS',json.dumps(parser.assets[:100]))
          matches=set()
          for asset in parser.assets[:60]:
              u=urllib.parse.urljoin(root,asset)
              try:
                  data=fetch(u).decode('utf-8','replace')
              except Exception as e:
                  print('ASSET_ERROR',u,type(e).__name__,str(e)[:180])
                  continue
              urls=re.findall(r'https?://[^\\\"\x27\s<>\\]+',data)
              for url in urls:
                  url=url.rstrip('.,});]\\')
                  if any(x in url.lower() for x in ('json','repo','altstore','ipa','source','sideload','github.io','pages.dev','githubusercontent.com')):
                      matches.add(url)
              print('ASSET_STATS',len(data),'URL_CANDIDATES',len(urls),'MATCHED',len(matches),u)
              if 'shrublibrary' in data.lower():
                  for key in ('repos:', 'repoUrl:', 'sourceURL:', 'sourceUrl:', 'defaultRepos', 'repoList'):
                      ix=data.find(key)
                      if ix>=0:
                          print('CONTEXT',key,data[max(0,ix-150):ix+450])
          print('MATCHED_URLS_COUNT',len(matches))
          for url in sorted(matches)[:600]:
              print('MATCHED_URL',url[:850])
          PY

      - name: Extract embedded repository index and data shapes
        run: |
          python3 - <<'PY'
          import re
          import urllib.request
          with urllib.request.urlopen(urllib.request.Request('https://shrublibrary.pages.dev/',headers={'User-Agent':'Mozilla/5.0'}),timeout=30) as response:
              html=response.read().decode('utf-8','replace')
          print('TOTAL_HTML_BYTES',len(html))
          scripts=re.findall(r'<script\b[^>]*>([\s\S]*?)</script\s*>',html,re.I)
          print('INLINE_SCRIPT_COUNT',len(scripts),'SIZES',[len(s) for s in scripts])
          for word in ['DEFAULT_REPOS','BUILTIN_REPOS','builtinRepos','defaultRepos','REPO_LIST','const repos','const REPOS','repoSources','sources =','sourceURL','altstore','repoUrl','repos:']:
              ix=html.find(word)
              if ix>=0: print('INDEX_CONTEXT',word,ix,repr(html[max(0,ix-150):ix+900]))
          for url in sorted(set(re.findall(r"""https?://[^\s"'<>\\]+""",html))):
              if any(k in url.lower() for k in ['json','repo','altstore','ipa','github.io','pages.dev','source','sidestore']):
                  print('INDEX_URL',url[:500])
          print('INLINE_SCRIPT_HEAD',repr(max(scripts,key=len)[:3500]) if scripts else '')
          PY

      - name: Identify ShrubLibrary live catalog endpoint
        run: |
          python3 - <<'PY'
          import re,urllib.request
          req=urllib.request.Request('https://shrublibrary.pages.dev/',headers={'User-Agent':'Mozilla/5.0'})
          html=urllib.request.urlopen(req,timeout=30).read().decode()
          js=max(re.findall(r'<script\b[^>]*>([\s\S]*?)</script\s*>',html,re.I),key=len)
          terms=['defaultUrls','userUrls','fetch(', '/api/', 'api/', 'repo-list', 'repo.json', 'repositories.json', 'repos.json', '.json', 'new URL(', '/default', 'default-repos', 'repoSources', 'S.defaultUrls','initRepos']
          for term in terms:
              found=list(re.finditer(re.escape(term),js,re.I))
              print('TERM',term,'MATCHES',len(found))
              for m in found[:14]:
                  print('SNIPPET',term,m.start(),repr(js[max(0,m.start()-260):m.end()+450]))
          PY

      - name: Retrieve published default repositories
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.parse
          u='https://shrublibrary.pages.dev/repos.txt'
          data=urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0 (AlleyCat upstream compatibility audit)'}),timeout=30).read().decode('utf-8-sig')
          urls=[line.strip() for line in data.splitlines() if line.strip() and not line.lstrip().startswith('#')]
          unique=list(dict.fromkeys(urls))
          print('SHRUB_INDEX_RAW_BYTES',len(data),'SHRUB_INDEX_ENTRIES',len(urls),'SHRUB_INDEX_UNIQUE',len(unique))
          if len(unique)<100:
              raise SystemExit('ShrubLibrary catalog below expected minimum; refuse incomplete import')
          for ix,u in enumerate(unique):
              parts=urllib.parse.urlsplit(u)
              if parts.scheme != 'https' or not parts.netloc:
                  raise SystemExit(f'Invalid catalog URL at index {ix}: {u!r}')
              print('SHRUB_REPO',ix+1,u)
          PY

      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Swift parser check for the opt-in ShrubLibrary picker
        run: |
          set -euo pipefail
          swiftc -frontend -parse ThirdParty/SideStore/Source/AltStore/Sources/AddSourceViewController.swift
          grep -q 'https://shrublibrary.pages.dev/repos.txt' ThirdParty/SideStore/Source/AltStore/Sources/AddSourceViewController.swift
          grep -q 'self.navigationController?.pushViewController(picker, animated: true)' ThirdParty/SideStore/Source/AltStore/Sources/AddSourceViewController.swift
          echo 'ShrubLibrary picker Swift syntax and opt-in navigation verified'
