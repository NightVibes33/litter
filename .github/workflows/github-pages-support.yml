name: Deploy GitHub Pages Support

on:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'docs/alley-cat-support/**'
      - '.github/workflows/github-pages-support.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-support
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout website files only
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            index.html
            docs/alley-cat-support
          sparse-checkout-cone-mode: false
          submodules: false
          lfs: false
          persist-credentials: false

      - name: Assemble minimal static Pages site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/alley-cat-support
          cp index.html _site/index.html
          cp -R docs/alley-cat-support/. _site/alley-cat-support/
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/alley-cat-support/index.html
          test -s _site/alley-cat-support/privacy.html
          if find _site -type l -print -quit | grep -q .; then
            echo "::error::GitHub Pages artifact must not contain symlinks."
            exit 1
          fi
          echo "Pages artifact contents:"
          find _site -type f -print
          du -sh _site

      # The legacy autogenerated job uploads the entire repository root and
      # fails as the iOS/Rust vendor tree grows. Attempt to switch the Pages
      # source to this workflow. GitHub may deny the switch to GITHUB_TOKEN
      # (Pages setting changes can require administration:write); in that
      # case set Settings > Pages > Build and deployment > GitHub Actions.
      - name: Prefer workflow Pages source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api --method PUT "/repos/${GITHUB_REPOSITORY}/pages" -f build_type=workflow > /dev/null 2> "${RUNNER_TEMP}/pages-source-error.txt"; then
            echo "Pages publishing source: GitHub Actions"
          else
            echo "::warning::Unable to switch GitHub Pages source automatically. In repository Settings > Pages, set Build and deployment > Source to GitHub Actions to stop the autogenerated root upload failures."
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload minimal Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
