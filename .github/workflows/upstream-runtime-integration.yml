name: Upstream runtime integration

on:
  pull_request:
    paths:
      - 'shared/rust-bridge/**'
      - 'shared/third_party/**'
      - 'ThirdParty/**'
      - 'patches/codex/**'
      - 'apps/ios/scripts/sync-codex.sh'
      - 'apps/ios/Sources/KittyStoreSigning/**'
      - 'tools/scripts/verify-sidesign-adapter.sh'
      - 'tools/scripts/build-kittystore-unicorn.sh'
      - 'tools/scripts/vendor-nyxian*'
      - 'tools/scripts/verify-*'
      - '.github/workflows/upstream-runtime-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config libssl-dev libclang-dev protobuf-compiler
      - name: Verify recorded dependency closure
        run: |
          python3 tools/scripts/verify-upstream-dependencies.py
          sh tools/scripts/verify-nyxian-source-import.sh
          bash tools/scripts/verify-kittystore-integration.sh
      - name: Apply reproducible mobile Codex patches
        run: bash apps/ios/scripts/sync-codex.sh --recorded-gitlink
      - name: Verify pinned native dependency checkout behavior
        run: |
          rustc --edition 2021 --test ThirdParty/SideStore/native-dependencies.rs -o /tmp/litter-native-dependency-tests
          /tmp/litter-native-dependency-tests
      - name: Verify tool lifecycle and model catalog
        run: |
          cargo test --manifest-path shared/rust-bridge/Cargo.toml -p codex-slingshot --lib json_line_wire --locked
          cargo test --manifest-path shared/rust-bridge/Cargo.toml -p codex-slingshot --test mobile_model_catalog --locked
      - name: Verify shared mobile runtime
        run: cargo test --manifest-path shared/rust-bridge/Cargo.toml -p codex-mobile-client --lib --locked

  sidesign:
    name: Verify SideSign and KittyStore signing adapter
    runs-on: macos-26-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'
      - uses: actions/cache/restore@v4
        id: sidesign_cache
        with:
          path: ThirdParty/SideStore/SideSign/.build
          key: sidesign-v1-${{ runner.os }}-xcode26.3-${{ hashFiles('ThirdParty/SideStore/SideSign/Package.swift') }}
          restore-keys: sidesign-v1-${{ runner.os }}-xcode26.3-
      - name: Verify signer and host data boundary
        run: bash tools/scripts/verify-sidesign-adapter.sh
      - uses: actions/cache/save@v4
        if: always() && steps.sidesign_cache.outputs.cache-hit != 'true'
        with:
          path: ThirdParty/SideStore/SideSign/.build
          key: ${{ steps.sidesign_cache.outputs.cache-primary-key }}
