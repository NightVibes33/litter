name: PocketKernel Root Tab Stage

on:
  push:
    branches:
      - pocketkernel/apple-foundation-models
    paths:
      - '.github/workflows/pocketkernel-root-tab-patch.yml'

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pocketkernel/apple-foundation-models
          fetch-depth: 0

      - name: Apply dedicated Chat tab patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app = Path('apps/ios/Sources/Litter/LitterApp.swift')
          text = app.read_text()
          start_marker = '    private func standardHomeNavigationView(topInset: CGFloat, bottomInset: CGFloat) -> some View {'
          end_marker = '    @ViewBuilder\n    private var standardOverlays: some View {'
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('standardHomeNavigationView boundaries not found')

          replacement = '''    private func standardHomeNavigationView(topInset: CGFloat, bottomInset: CGFloat) -> some View {
              TabView {
                  HomeNavigationView(
                      topInset: topInset,
                      bottomInset: bottomInset + 52
                  )
                  .tabItem {
                      Label("Home", systemImage: "house.fill")
                  }

                  NavigationStack {
                      PocketKernelChatView()
                  }
                  .tabItem {
                      Label("Chat", systemImage: "bubble.left.and.bubble.right.fill")
                  }
              }
              .tint(LitterTheme.accent)
              .toolbarBackground(.visible, for: .tabBar)
              .toolbarBackground(.ultraThinMaterial, for: .tabBar)
              .frame(maxWidth: .infinity, maxHeight: .infinity)
              .ignoresSafeArea(.container, edges: .top)
              .id(themeManager.themeVersion)
              .onAppear {
                  if !splashDismissed {
                      splashDismissed = true
                      (UIApplication.shared.delegate as? AppDelegate)?.signalContentReady()
                  }
              }
          }

          '''
          app.write_text(text[:start] + replacement + text[end:])

          agent = Path('apps/ios/Sources/Litter/Models/PocketKernelLocalAgent.swift')
          text = agent.read_text()
          old = 'guard let exitCode = Int32(statusText) else {'
          new = 'guard let exitCode = Int32(String(statusText)) else {'
          if old not in text:
              raise SystemExit('exit status parser target not found')
          agent.write_text(text.replace(old, new, 1))

          Path('.github/workflows/pocketkernel-root-tab-patch.yml').unlink()
          PY

      - name: Commit and publish staging tag
        run: |
          git config user.name "PocketKernel CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Add dedicated PocketKernel Chat bottom tab"
          git tag -f pocketkernel-root-tab-stage-1
          git push --force origin refs/tags/pocketkernel-root-tab-stage-1
          echo "STAGED_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
