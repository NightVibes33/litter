name: Android APK Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      build_only:
        description: "Build an installable debug APK without store signing or publishing"
        type: boolean
        default: false
      bindings_run_id:
        description: "Reuse shared-prep from a prior run with unchanged binding sources"
        type: string
        default: ""
      abis:
        description: "CPU architectures (ARM64 phones/TVs, x86-64 emulators/PCs)"
        type: choice
        default: arm64-v8a
        options:
          - arm64-v8a
          - armeabi-v7a
          - x86_64
          - arm64-v8a,x86_64

permissions:
  contents: write
  actions: read

jobs:
  detect-android-changes:
    runs-on: ubuntu-latest
    outputs:
      run_release: ${{ steps.filter.outputs.run_release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Detect Android-related changes
        id: filter
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]] || [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "run_release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed_files="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" || true)"
          echo "Changed files:"
          echo "$changed_files"

          run_release=false
          while IFS= read -r file; do
            [[ -z "$file" ]] && continue
            case "$file" in
              apps/android/*|shared/rust-bridge/*|.github/workflows/android-apk-release.yml|.github/workflows/android.yml)
                run_release=true
                break
                ;;
            esac
          done <<< "$changed_files"

          echo "run_release=$run_release" >> "$GITHUB_OUTPUT"

  shared-prep:
    needs: detect-android-changes
    if: needs.detect-android-changes.outputs.run_release == 'true'
    runs-on: macos-26-intel
    timeout-minutes: 180
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      SCCACHE_BUCKET: rust-cache
      SCCACHE_ENDPOINT: ${{ secrets.SCCACHE_R2_ENDPOINT }}
      SCCACHE_REGION: auto
      SCCACHE_S3_USE_SSL: "true"
      SCCACHE_S3_KEY_PREFIX: ci/android-release-prep
      AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_R2_SECRET_ACCESS_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Validate reusable binding sources
        if: inputs.bindings_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          BINDINGS_RUN_ID: ${{ inputs.bindings_run_id }}
        run: |
          set -euo pipefail
          [[ "$BINDINGS_RUN_ID" =~ ^[0-9]+$ ]]
          source_sha="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BINDINGS_RUN_ID" --jq '.head_sha')"
          git diff --exit-code "$source_sha" "$GITHUB_SHA" -- \
            shared/rust-bridge shared/third_party/codex
          while IFS= read -r patch; do
            case "$patch" in
              patches/codex/android-armv7-file-mode.patch) ;;
              *) echo "Binding-affecting patch changed: $patch"; exit 1 ;;
            esac
          done < <(git diff --name-only "$source_sha" "$GITHUB_SHA" -- patches/codex)

      - name: Download reusable shared bindings
        if: inputs.bindings_run_id != ''
        uses: actions/download-artifact@v7
        with:
          name: shared-prep
          path: .ci-reused-bindings
          run-id: ${{ inputs.bindings_run_id }}
          github-token: ${{ github.token }}

      - name: Restore reusable shared bindings
        if: inputs.bindings_run_id != ''
        run: |
          set -euo pipefail
          archive="$(find .ci-reused-bindings -name generated-mobile-sources.tgz -print -quit)"
          test -n "$archive"
          tar -xzf "$archive" -C .

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Setup Zig (libghostty build)
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Configure sccache
        run: |
          if [ -n "${SCCACHE_ENDPOINT:-}" ] && [ -n "${AWS_ACCESS_KEY_ID:-}" ] && [ -n "${AWS_SECRET_ACCESS_KEY:-}" ]; then
            echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          else
            echo "SCCACHE_BUCKET=" >> "$GITHUB_ENV"
            echo "SCCACHE_ENDPOINT=" >> "$GITHUB_ENV"
            echo "SCCACHE_S3_KEY_PREFIX=" >> "$GITHUB_ENV"
            echo "AWS_ACCESS_KEY_ID=" >> "$GITHUB_ENV"
            echo "AWS_SECRET_ACCESS_KEY=" >> "$GITHUB_ENV"
          fi

      - name: Setup sccache
        if: env.SCCACHE_ENDPOINT != '' && env.AWS_ACCESS_KEY_ID != '' && env.AWS_SECRET_ACCESS_KEY != ''
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Sync codex submodule
        run: ./apps/ios/scripts/sync-codex.sh --preserve-current

      - name: Restore generated mobile bindings cache
        id: mobile-bindings-cache
        uses: actions/cache@v5
        with:
          path: |
            shared/rust-bridge/generated
          key: mobile-bindings-kotlin-${{ runner.os }}-${{ hashFiles('apps/ios/scripts/sync-codex.sh', 'shared/rust-bridge/generate-bindings.sh', 'shared/rust-bridge/Cargo.toml', 'shared/rust-bridge/Cargo.lock', 'shared/rust-bridge/codex-mobile-client/src/**', 'shared/rust-bridge/uniffi-bindgen/**', 'patches/codex/**', 'shared/third_party/codex/codex-rs/app-server-protocol/src/protocol/**', 'shared/third_party/codex/codex-rs/protocol/src/**') }}

      - name: Generate shared mobile bindings
        if: inputs.bindings_run_id == '' && steps.mobile-bindings-cache.outputs.cache-hit != 'true'
        env:
          CARGO_INCREMENTAL: "0"
        run: |
          cd shared/rust-bridge
          ./generate-bindings.sh --kotlin-only

      - name: Generate Material3 scheme roles
        run: |
          bash tools/scripts/generate-material-schemes.sh

      - name: Package shared prep artifact
        run: |
          mkdir -p .ci-prep/shared
          tar -czf .ci-prep/shared/generated-mobile-sources.tgz -C . \
            shared/rust-bridge/generated \
            apps/android/app/src/main/java/com/litter/android/ui/LitterMaterialSchemes.generated.kt \

      - name: Upload shared prep artifact
        uses: actions/upload-artifact@v6
        with:
          name: shared-prep
          path: .ci-prep/shared
          if-no-files-found: error

  release-apk:
    needs: [detect-android-changes, shared-prep]
    if: needs.detect-android-changes.outputs.run_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: release
    env:
      ANDROID_ABIS: ${{ inputs.abis || 'arm64-v8a' }}
      SCCACHE_BUCKET: rust-cache
      SCCACHE_ENDPOINT: ${{ secrets.SCCACHE_R2_ENDPOINT }}
      SCCACHE_REGION: auto
      SCCACHE_S3_USE_SSL: "true"
      SCCACHE_S3_KEY_PREFIX: ci/android
      SCCACHE_LOG: info
      AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_R2_SECRET_ACCESS_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '12266719'

      - name: Install Android platforms and NDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;30.0.14904198"

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev libcap-dev clang cmake

      - name: Setup Zig (libghostty build)
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Configure sccache
        run: |
          if [ -n "${SCCACHE_ENDPOINT:-}" ] && [ -n "${AWS_ACCESS_KEY_ID:-}" ] && [ -n "${AWS_SECRET_ACCESS_KEY:-}" ]; then
            echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          else
            echo "SCCACHE_BUCKET=" >> "$GITHUB_ENV"
            echo "SCCACHE_ENDPOINT=" >> "$GITHUB_ENV"
            echo "SCCACHE_S3_KEY_PREFIX=" >> "$GITHUB_ENV"
            echo "AWS_ACCESS_KEY_ID=" >> "$GITHUB_ENV"
            echo "AWS_SECRET_ACCESS_KEY=" >> "$GITHUB_ENV"
          fi

      - name: Setup sccache
        if: env.SCCACHE_ENDPOINT != '' && env.AWS_ACCESS_KEY_ID != '' && env.AWS_SECRET_ACCESS_KEY != ''
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Prime sccache
        if: env.SCCACHE_ENDPOINT != '' && env.AWS_ACCESS_KEY_ID != '' && env.AWS_SECRET_ACCESS_KEY != ''
        run: |
          export SCCACHE_ERROR_LOG="$RUNNER_TEMP/sccache-android.log"
          rm -f "$SCCACHE_ERROR_LOG"
          sccache --stop-server || true
          sccache --start-server
          sccache --show-stats || true

      - name: Download shared prep artifact
        uses: actions/download-artifact@v7
        with:
          name: shared-prep
          path: .ci-prep/shared

      - name: Restore shared prep
        run: |
          ./apps/ios/scripts/sync-codex.sh --preserve-current

          SHARED_PREP_ROOT=.ci-prep/shared
          if [ -d "$SHARED_PREP_ROOT/shared" ]; then
            SHARED_PREP_ROOT="$SHARED_PREP_ROOT/shared"
          fi

          tar -xzf "$SHARED_PREP_ROOT/generated-mobile-sources.tgz" -C .
          mkdir -p .build-stamps
          touch .build-stamps/sync .build-stamps/bindings-kotlin

      - name: Install cargo-ndk
        run: env -u RUSTC_WRAPPER cargo install cargo-ndk --locked

      - name: Build Rust JNI libs
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/30.0.14904198
        run: make rust-android

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Prepare local runtime assets
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/30.0.14904198
        run: make android-alpine-fs proot-android

      - name: Build and test installable debug APK
        if: inputs.build_only
        run: apps/android/gradlew -p apps/android :app:assembleDebug :app:testDebugUnitTest :app:assembleDebugAndroidTest

      - name: Upload device and TV build
        if: inputs.build_only
        uses: actions/upload-artifact@v6
        with:
          name: alleycat-android-${{ inputs.abis }}
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Decode upload keystore
        if: ${{ !inputs.build_only }}
        env:
          ANDROID_UPLOAD_KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_B64 }}
        run: |
          if [ -z "${ANDROID_UPLOAD_KEYSTORE_B64:-}" ]; then
            echo "Missing secret ANDROID_UPLOAD_KEYSTORE_B64"
            exit 1
          fi
          store_file="$RUNNER_TEMP/litter-upload.jks"
          echo "$ANDROID_UPLOAD_KEYSTORE_B64" | base64 --decode > "$store_file"
          echo "LITTER_UPLOAD_STORE_FILE=$store_file" >> "$GITHUB_ENV"
          ls -lh "$store_file"

      - name: Build signed release APK
        if: ${{ !inputs.build_only }}
        env:
          LITTER_UPLOAD_STORE_FILE: ${{ env.LITTER_UPLOAD_STORE_FILE }}
          LITTER_UPLOAD_STORE_PASSWORD: ${{ secrets.LITTER_UPLOAD_STORE_PASSWORD }}
          LITTER_UPLOAD_KEY_ALIAS: ${{ secrets.LITTER_UPLOAD_KEY_ALIAS }}
          LITTER_UPLOAD_KEY_PASSWORD: ${{ secrets.LITTER_UPLOAD_KEY_PASSWORD }}
        run: apps/android/gradlew -p apps/android :app:assembleRelease

      - name: Generate checksums
        if: ${{ !inputs.build_only }}
        run: |
          APK_PATH="apps/android/app/build/outputs/apk/release/app-release.apk"
          sha256sum "$APK_PATH" > "${APK_PATH}.sha256"

      - name: Upload build artifact (manual runs)
        if: github.event_name == 'workflow_dispatch' && !inputs.build_only
        uses: actions/upload-artifact@v6
        with:
          name: app-release
          path: |
            apps/android/app/build/outputs/apk/release/app-release.apk
            apps/android/app/build/outputs/apk/release/app-release.apk.sha256

      - name: Publish GitHub Release (tag runs)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            apps/android/app/build/outputs/apk/release/app-release.apk
            apps/android/app/build/outputs/apk/release/app-release.apk.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true
