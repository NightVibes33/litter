name: Dispatch PocketKernel iPhone Build

on:
  push:
    branches:
      - pocketkernel/apple-foundation-models
    paths:
      - '.github/workflows/pocketkernel-build-dispatch.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Start fast device IPA build for integration branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            --method POST \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            /repos/${{ github.repository }}/actions/workflows/ios-unsigned-ipa.yml/dispatches \
            -f ref='pocketkernel/apple-foundation-models' \
            -f 'inputs[build_mode]=fast-device'
