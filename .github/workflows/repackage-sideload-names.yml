name: Repackage unsigned IPA for SideStore
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repackage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download verified existing unsigned release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p input output
          gh release download litter-v1.5.169 --repo "$GITHUB_REPOSITORY" --pattern 'AlleyCat-1.5.169.ipa' --pattern 'AlleyCat-1.5.169.ipa.sha256' --dir input
          (cd input && sha256sum -c AlleyCat-1.5.169.ipa.sha256)
      - name: Prepare and verify unsigned IPA
        run: |
          python3 tools/scripts/prepare-sideload-names.py --ipa input/AlleyCat-1.5.169.ipa --output output/AlleyCat-1.5.169-SideStore.ipa
          python3 - <<'PY'
          import hashlib, plistlib, zipfile
          with zipfile.ZipFile('input/AlleyCat-1.5.169.ipa') as old, zipfile.ZipFile('output/AlleyCat-1.5.169-SideStore.ipa') as new:
              assert old.namelist() == new.namelist()
              changed = []
              for entry in old.infolist():
                  other = new.getinfo(entry.filename)
                  assert entry.external_attr == other.external_attr
                  def digest(archive):
                      value = hashlib.sha256()
                      with archive.open(entry.filename) as stream:
                          for chunk in iter(lambda: stream.read(1024 * 1024), b''):
                              value.update(chunk)
                      return value.digest()
                  if digest(old) == digest(new):
                      continue
                  assert entry.filename.endswith('/Info.plist')
                  before, after = (plistlib.loads(archive.read(entry.filename)) for archive in (old, new))
                  assert {k: v for k, v in before.items() if k not in ('CFBundleName', 'CFBundleDisplayName')} == {k: v for k, v in after.items() if k not in ('CFBundleName', 'CFBundleDisplayName')}
                  assert after['CFBundleDisplayName'].isascii()
                  changed.append(entry.filename)
              assert changed, 'No bundle names changed'
              print('Verified: only bundle names changed; all binaries, resources, bundle IDs, and ZIP permissions retained.')
              print('Changed bundle plists:', changed)
          PY
          (cd output && sha256sum AlleyCat-1.5.169-SideStore.ipa > AlleyCat-1.5.169-SideStore.ipa.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: AlleyCat-SideStore-unsigned-ipa
          path: output/*
      - name: Publish corrected download alongside original
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload litter-v1.5.169 output/* --repo "$GITHUB_REPOSITORY"
